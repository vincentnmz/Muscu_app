<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Login · hexagones en fond — maquette</title>
<style>
  :root{ --accent:#1A5FFF; --muted:#5f6b85; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:#0b2a8a;min-height:100vh;overflow:hidden;color:#fff}
  .sky{position:fixed;inset:0;overflow:hidden;z-index:0}
  .blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75;mix-blend-mode:screen;will-change:transform}
  .b1{background:#1A5FFF;left:-20vmax;top:-20vmax}.b2{background:#22d3ee;right:-25vmax;top:10vmax}
  .b3{background:#7c3aed;left:10vmax;bottom:-30vmax}.b4{background:#ffffff;right:10vmax;top:-30vmax;opacity:.3}
  .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.10) 50%,transparent 65%);background-size:250% 100%;animation:sheen 8s ease-in-out infinite}
  @keyframes sheen{0%{background-position:150% 0}100%{background-position:-50% 0}}
  /* Hexagones qui dérivent, chacun avec son objet qui se transforme */
  .hx{position:absolute;left:0;top:0;will-change:transform}
  .hx svg.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .hx .hf{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.45);stroke-width:1.4}
  .hx .hg{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px #9cc0ff)}
  .hx .hg.run{animation:trace 1.6s ease-in-out}
  @keyframes trace{0%{stroke-dashoffset:1;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  .hx .ic{position:absolute;left:14.3%;top:17.4%;width:71.4%;height:65.2%}
  .hx .ic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .hx .real *,.hx .line *{fill:none !important;stroke:#fff !important;stroke-width:2 !important;stroke-linecap:round;stroke-linejoin:round}
  .hx .line *{stroke-dasharray:1;stroke-dashoffset:1}
  .hx .real,.hx .line{filter:drop-shadow(0 0 5px rgba(156,192,255,.8))}
  /* Logo Novalyz animé (inchangé), en blanc sur le fond */
  .login{position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;pointer-events:none}
  .login>*{pointer-events:auto}
  .lg{width:96px;height:105px;margin:0 auto 12px}
  .lg svg{width:100%;height:100%;color:#fff}
  .lg svg [fill="#1A5FFF"]{fill:#9cc0ff}
  .lg svg [stroke="#1A5FFF"]{stroke:#9cc0ff}
  .brand{font-size:30px;letter-spacing:.32em;font-weight:900;margin-bottom:6px}
  .brand b{color:#d6e4ff}
  .tag{font-size:13px;color:rgba(255,255,255,.8);margin-bottom:22px}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(3,10,40,.35)}
  .card label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);margin:10px 0 6px}
  .card input{width:100%;border:1px solid transparent;background:rgba(255,255,255,.92);border-radius:11px;padding:12px;font:inherit;font-size:15px}
  .card button{width:100%;margin-top:16px;border:none;border-radius:13px;background:#fff;color:var(--accent);font:inherit;font-weight:800;font-size:15px;padding:13px}
  .sports{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw;background:rgba(255,255,255,.94);border-radius:14px;padding:4px;box-shadow:0 6px 18px rgba(13,20,36,.15)}
  .sports button{border:none;background:transparent;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer}
  .sports button.on{background:#0d1424;color:#fff}

/* ---- Logo animé : A2 (barres puis points puis traits) / B2 (courbe puis barres),
   tiré au hasard. L'hexagone reste fixe. ---- */
.nvl-ic { overflow:visible; }
.nvl-ic .nvl-b, .nvl-ic .nvl-d { transform-box:fill-box; }
.nvl-ic .nvl-b { transform-origin:50% 100%; }
.nvl-ic .nvl-d { transform-origin:50% 50%; }
.nvl-ic .nvl-l { stroke-dasharray:70; stroke-dashoffset:70; }
.nvl-ic.nvl-X .nvl-l { stroke-dashoffset:0; }
.nvl-A2 .nvl-b,.nvl-A2 .nvl-d,.nvl-A2 .nvl-l{animation-duration:4s;animation-iteration-count:infinite;animation-fill-mode:both}

@keyframes nvl-a2d1{0%,12%{transform:translateY(-70px) scale(.6);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}17%{transform:translateY(0) scale(1.25,.75);opacity:1;animation-timing-function:ease-out}20%{transform:translateY(-14px) scale(.95,1.05);animation-timing-function:ease-in}23%,86%{transform:none;opacity:1}96%,100%{transform:scale(0);opacity:0}}
@keyframes nvl-a2d2{0%,27%{transform:translateY(-70px) scale(.6);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}32%{transform:translateY(0) scale(1.25,.75);opacity:1;animation-timing-function:ease-out}35%{transform:translateY(-14px) scale(.95,1.05);animation-timing-function:ease-in}38%,86%{transform:none;opacity:1}96%,100%{transform:scale(0);opacity:0}}

@keyframes nvl-a2d4{0%,48%{transform:translateY(-70px) scale(.6);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}53%{transform:translateY(0) scale(1.25,.75);opacity:1;animation-timing-function:ease-out}56%{transform:translateY(-14px);animation-timing-function:ease-in}59%{transform:none}74%{transform:scale(1)}78%{transform:scale(1.7)}82%,86%{transform:scale(1)}96%,100%{transform:scale(0);opacity:0}}

<script>
// Pentagone régulier (centre cx,cy, rayon r, rotation en degrés).
function penta(cx, cy, r, rot) { var p = []; for (var i = 0; i < 5; i++) { var a = (rot - 90 + i * 72) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); } return p.join(' '); }
function ptAt(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
var GLOSS = '<ellipse cx="36" cy="30" rx="15" ry="9" fill="#fff" opacity=".45" transform="rotate(-28 36 30)"/>';
function foot() {
  var s = '<circle cx="50" cy="50" r="44" fill="url(#gFoot)"/><g clip-path="url(#cBall)">';
  // Coutures : du pentagone central vers les pentagones extérieurs (motif ballon « 32 panneaux »)
  for (var i = 0; i < 5; i++) {
    // Couture radiale depuis chaque sommet du pentagone central, puis fourche vers les pentagones voisins (hexagones).
    var v = ptAt(50, 50, 13, i * 72), o = ptAt(50, 50, 27, i * 72), a1 = ptAt(50, 50, 33, i * 72 + 21), a2 = ptAt(50, 50, 33, i * 72 - 21);
    var f = function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); };
    s += '<path d="M' + f(v) + 'L' + f(o) + 'M' + f(o) + 'L' + f(a1) + 'M' + f(o) + 'L' + f(a2) + '" fill="none" stroke="#a3a9b4" stroke-width="1.1"/>';
    var c = ptAt(50, 50, 41, i * 72 + 36);
    s += '<polygon points="' + penta(c[0], c[1], 12.5, i * 72 + 36 + 180) + '" fill="url(#gPenta)"/>';
  }
  s += '<polygon points="' + penta(50, 50, 13, 0) + '" fill="url(#gPenta)"/>';
  return s + '</g><circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#7d8592" stroke-width="1"/>';
}
function basket() {
  return '<circle cx="50" cy="50" r="44" fill="url(#gBasket)"/>'
    + '<g fill="none" stroke="#1b1410" stroke-width="2.6" stroke-linecap="round" clip-path="url(#cBall)">'
