name: Tests des calculs

# Lance TOUTE la suite de tests (npm test → scripts/run-tests.mjs : 86 suites —
# moteur, droits d'accès, sessions, saisie, agrégats, lectures…) à chaque push
# et pull request sur dev et main. Vérification seulement : ne déploie rien et
# ne bloque pas la mise en ligne (deploy.yml est indépendant).
# Node 22 : les tests transpilent index.ts avec node:module stripTypeScriptTypes.
# Seule dépendance : Playwright (installé à la volée) pour le banc de profils.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  calculs:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Banc de profils (14/11) : la vraie app dans Chromium (tests/banc-profils.test.js).
      - name: Installer Playwright + Chromium (banc de profils)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium

      - name: Lancer toutes les suites de tests
        run: node scripts/run-tests.mjs
