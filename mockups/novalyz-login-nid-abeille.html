<title>Login · nid d'abeille révélé — maquette</title>
<style>
  :root{ --accent:#1A5FFF; --muted:#5f6b85; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:#0b2a8a;min-height:100vh;overflow:hidden;color:#fff}
  .sky{position:fixed;inset:0;overflow:hidden;z-index:0}
  .blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75;mix-blend-mode:screen;will-change:transform}
  .b1{background:#1A5FFF;left:-20vmax;top:-20vmax}.b2{background:#22d3ee;right:-25vmax;top:10vmax}
  .b3{background:#7c3aed;left:10vmax;bottom:-30vmax}.b4{background:#ffffff;right:10vmax;top:-30vmax;opacity:.3}
  .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.10) 50%,transparent 65%);background-size:250% 100%;animation:sheen 8s ease-in-out infinite}
  @keyframes sheen{0%{background-position:150% 0}100%{background-position:-50% 0}}
  /* Nid d'abeille : chaque alvéole contient un sport, révélé près de la souris / de la lueur */
  #comb{position:absolute;inset:0;width:100%;height:100%}
  .cell .hc{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1.2;transition:stroke 1.8s ease,fill 1.8s ease}
  .cell.on .hc{stroke:rgba(255,255,255,.32);fill:rgba(255,255,255,.035)}
  .cell use{color:#fff;opacity:0;stroke-dasharray:1;stroke-dashoffset:1;transition:opacity 1.8s ease,stroke-dashoffset 2.8s ease}
  .cell.on use{opacity:.5;stroke-dashoffset:0}
  .cell.on use{filter:drop-shadow(0 0 3px rgba(156,192,255,.6))}
  /* Logo Novalyz animé (inchangé), en blanc sur le fond */
  .login{position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;pointer-events:none}
  .login>*{pointer-events:auto}
  .lg{width:96px;height:105px;margin:0 auto 12px}
  .lg svg{width:100%;height:100%;color:#fff}
  .lg svg [fill="#1A5FFF"]{fill:#9cc0ff}
  .lg svg [stroke="#1A5FFF"]{stroke:#9cc0ff}
  .brand{font-size:30px;letter-spacing:.32em;font-weight:900;margin-bottom:6px}
  .brand b{color:#d6e4ff}
  .tag{font-size:13px;color:rgba(255,255,255,.8);margin-bottom:22px}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(3,10,40,.35)}
  .card label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);margin:10px 0 6px}
  .card input{width:100%;border:1px solid transparent;background:rgba(255,255,255,.92);border-radius:11px;padding:12px;font:inherit;font-size:15px}
  .card button{width:100%;margin-top:16px;border:none;border-radius:13px;background:#fff;color:var(--accent);font:inherit;font-weight:800;font-size:15px;padding:13px}
  .sports{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw;background:rgba(255,255,255,.94);border-radius:14px;padding:4px;box-shadow:0 6px 18px rgba(13,20,36,.15)}
  .sports button{border:none;background:transparent;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer}
  .sports button.on{background:#0d1424;color:#fff}

<script>
// Pentagone régulier (centre cx,cy, rayon r, rotation en degrés).
function penta(cx, cy, r, rot) { var p = []; for (var i = 0; i < 5; i++) { var a = (rot - 90 + i * 72) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); } return p.join(' '); }
function ptAt(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
var GLOSS = '<ellipse cx="36" cy="30" rx="15" ry="9" fill="#fff" opacity=".45" transform="rotate(-28 36 30)"/>';
function foot() {
  // Ballon de foot : pentagone central, coutures vers 5 pentagones coupés par le bord, hexagones dessinés entre eux.
  var f = function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }, g = '';
  for (var i = 0; i < 5; i++) {
    // Couture du sommet central vers le pentagone extérieur placé dans la même direction (vrai motif du ballon).
    var v = ptAt(50, 50, 15, i * 72), e = ptAt(50, 50, 33.5, i * 72);
    g += '<path d="M' + f(v) + 'L' + f(e) + '"/>';
    var c = ptAt(50, 50, 45, i * 72);
    g += '<polygon points="' + penta(c[0], c[1], 12, i * 72 + 180) + '" fill="url(#gPenta)"/>';
    // Coutures entre deux pentagones extérieurs voisins (bord des hexagones).
    var a = ptAt(50, 50, 37, i * 72 + 14), b = ptAt(50, 50, 37, i * 72 + 58);
    g += '<path d="M' + f(a) + 'Q' + f(ptAt(50, 50, 31, i * 72 + 36)) + ' ' + f(b) + '"/>';
  }
  return '<circle cx="50" cy="50" r="44" fill="url(#gFoot)"/><g clip-path="url(#cBall)" stroke="#9aa1ad" stroke-width="1.3">' + g + '</g>'
    + '<polygon points="' + penta(50, 50, 15, 0) + '" fill="url(#gPenta)"/>'
    + '<circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#7d8592" stroke-width="1"/>';
}
function basket() {
  return '<circle cx="50" cy="50" r="44" fill="url(#gBasket)"/>'
    + '<g fill="none" stroke="#1b1410" stroke-width="2.6" stroke-linecap="round" clip-path="url(#cBall)">'
    + '<path d="M50 6 C46 30 46 70 50 94"/><path d="M6 50 C30 46 70 46 94 50"/>'
    + '<path d="M18 17 C33 33 33 67 18 83"/><path d="M82 17 C67 33 67 67 82 83"/></g>'
    + '<circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#7a3410" stroke-width="1"/>';
}
function rugby() {
  var laces = ''; for (var i = -3; i <= 3; i++) laces += '<rect x="' + (47 + i * 5.4).toFixed(1) + '" y="40" width="2.6" height="8" rx="1.2" fill="#fbfaf6" transform="rotate(0)"/>';
  return '<g transform="rotate(-32 50 50)"><ellipse cx="50" cy="50" rx="46" ry="27" fill="url(#gRugby)"/>'
    + '<path d="M8 50 Q50 38 92 50" fill="none" stroke="#3d1a07" stroke-width="1.6" opacity=".7"/>'
    + '<path d="M28 44 Q50 39 72 44" fill="none" stroke="#fbfaf6" stroke-width="2"/>' + laces

function tennis() {
  return '<circle cx="50" cy="50" r="40" fill="url(#gTennis)"/>'
    + '<g fill="none" stroke="#fdfdf2" stroke-width="4.2" stroke-linecap="round" clip-path="url(#cTen)"><path d="M14 20 C34 36 34 64 14 80"/><path d="M86 20 C66 36 66 64 86 80"/></g>'
    + '<circle cx="50" cy="50" r="40" fill="url(#gShade)"/><ellipse cx="38" cy="32" rx="13" ry="8" fill="#fff" opacity=".4" transform="rotate(-28 38 32)"/>'
    + '<circle cx="50" cy="50" r="40" fill="none" stroke="#8a9a10" stroke-width="1"/>';
}
function volley() {
  // Volley : 3 coutures courbes qui partent du centre (motif en « Y » tournant) + une couture parallèle
  // dans chaque panneau — le dessin classique du ballon de volley.
  var seam = '<path d="M50 50 C50 32 42 18 26 10"/><path d="M58 47 C59 30 52 16 40 7"/>';
  var g = '';
  [0, 120, 240].forEach(function (r) { g += '<g transform="rotate(' + r + ' 50 50)">' + seam + '</g>'; });
  return '<circle cx="50" cy="50" r="44" fill="url(#gWhite)"/><g clip-path="url(#cBall)" fill="none" stroke="#1e50d6" stroke-width="2.2">' + g + '</g>'
    + '<circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#8a93a3" stroke-width="1"/>';
}
function hand() {
  // Handball : panneau central en triangle bombé, 3 coutures vers le bord et 3 arcs qui ferment les panneaux.
  var f = function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }, v = [], d, sp = '';
  for (var k = 0; k < 3; k++) v.push(ptAt(50, 50, 19, k * 120));

  }
  return '<circle cx="50" cy="50" r="44" fill="url(#gWhite)"/><g clip-path="url(#cBall)" fill="none" stroke="#1e50d6" stroke-width="2.2"><path d="' + d + 'Z" fill="#d6262f" fill-opacity=".85"/>' + sp + '</g>'
    + '<circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#8a93a3" stroke-width="1"/>';

function haltere() {
  var plate = function (x, w, h, g) { return '<rect x="' + x + '" y="' + (50 - h / 2) + '" width="' + w + '" height="' + h + '" rx="3" fill="url(#' + g + ')" stroke="#05060a" stroke-width=".8"/><rect x="' + (x + 1) + '" y="' + (50 - h / 2 + 2) + '" width="' + (w - 2) + '" height="3" rx="1.5" fill="#fff" opacity=".18"/>'; };
  return '<rect x="6" y="46.5" width="88" height="7" rx="3.5" fill="url(#gBar)" stroke="#5c636e" stroke-width=".6"/>'
    + plate(14, 9, 44, 'gPlate') + plate(23, 7, 34, 'gPlate2') + '<rect x="30" y="44" width="4" height="12" rx="1.5" fill="#c9ced6" stroke="#6b737e" stroke-width=".6"/>'

    + '<rect x="36" y="47.4" width="28" height="1.6" fill="#fff" opacity=".55"/>';
}
function kettlebell() {
  return '<path d="M34 38 C30 14 70 14 66 38" fill="none" stroke="url(#gKb)" stroke-width="9" stroke-linecap="round"/>'
    + '<path d="M50 34 C74 34 86 52 82 70 C79 84 66 90 50 90 C34 90 21 84 18 70 C14 52 26 34 50 34Z" fill="url(#gKb)"/>'
    + '<rect x="36" y="80" width="28" height="6" rx="3" fill="#0b0c10"/>'
    + '<ellipse cx="38" cy="50" rx="10" ry="6" fill="#fff" opacity=".22" transform="rotate(-30 38 50)"/>'
    + '<text x="50" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#c9ced6" opacity=".85">16</text>';
}
function badminton() {
  var feathers = ''; for (var i = -3; i <= 3; i++) feathers += '<path d="M50 62 L' + (50 + i * 9) + ' 14" stroke="#c9ced6" stroke-width="1.1"/>';
  return '<path d="M50 62 L22 14 Q50 4 78 14 Z" fill="#fbfbf8" stroke="#aab1bc" stroke-width="1"/>' + feathers
    + '<path d="M30 32 Q50 26 70 32" fill="none" stroke="#c43b3b" stroke-width="2"/>'
    + '<path d="M36 46 Q50 42 64 46" fill="none" stroke="#c43b3b" stroke-width="2"/>'
    + '<path d="M40 62 Q50 58 60 62 L60 70 Q60 84 50 86 Q40 84 40 70 Z" fill="url(#gGolf)" stroke="#9aa1ad" stroke-width="1"/>'
    + '<rect x="40" y="60" width="20" height="5" rx="2" fill="#1e50d6"/>';
}
function baseball() {
  var st = ''; for (var i = 0; i < 9; i++) { var t = i / 8; var y = 18 + t * 64; st += '<path d="M' + (26 + Math.sin(t * Math.PI) * 9).toFixed(1) + ' ' + y.toFixed(1) + 'l4 -2" stroke="#c4262e" stroke-width="1.6"/><path d="M' + (74 - Math.sin(t * Math.PI) * 9).toFixed(1) + ' ' + y.toFixed(1) + 'l-4 -2" stroke="#c4262e" stroke-width="1.6"/>'; }
  return '<circle cx="50" cy="50" r="40" fill="url(#gGolf)"/><g clip-path="url(#cTen)" fill="none">'
    + '<path d="M22 16 C36 34 36 66 22 84" stroke="#c4262e" stroke-width="1.4"/><path d="M78 16 C64 34 64 66 78 84" stroke="#c4262e" stroke-width="1.4"/>' + st + '</g>'
    + '<circle cx="50" cy="50" r="40" fill="url(#gShade)"/><ellipse cx="38" cy="32" rx="13" ry="8" fill="#fff" opacity=".5" transform="rotate(-28 38 32)"/><circle cx="50" cy="50" r="40" fill="none" stroke="#9aa1ad" stroke-width="1"/>';
}
function golf() {
  var d = ''; for (var y = 22; y <= 80; y += 9) for (var x = 22; x <= 80; x += 9) { var dx = x + ((y / 9) % 2 ? 4.5 : 0); if ((dx - 50) * (dx - 50) + (y - 50) * (y - 50) < 30 * 30) d += '<circle cx="' + dx + '" cy="' + y + '" r="2.1" fill="#c4cad3" opacity=".7"/>'; }
  return '<circle cx="50" cy="50" r="34" fill="url(#gGolf)"/>' + d
    + '<circle cx="50" cy="50" r="34" fill="url(#gShade)"/><ellipse cx="40" cy="36" rx="10" ry="6" fill="#fff" opacity=".6" transform="rotate(-28 40 36)"/><circle cx="50" cy="50" r="34" fill="none" stroke="#9aa1ad" stroke-width="1"/>';
}
function hockey() {
  // Palet seul : dessus elliptique + tranche (côtés et arrondi du bas), sans hachures.
  return '<path d="M12 44 L12 60 A38 12 0 0 0 88 60 L88 44" fill="url(#gPuck)"/>'
    + '<ellipse cx="50" cy="44" rx="38" ry="12" fill="#2b2f37"/>'
    + '<ellipse cx="38" cy="41" rx="12" ry="3" fill="#fff" opacity=".18"/>';
}
// Équipements manquants (sports de l'app) : athlétisme, natation, combat.
function chrono() {
  return '<rect x="44" y="6" width="12" height="9" rx="2" fill="#9aa1ad"/><rect x="70" y="16" width="8" height="8" rx="2" fill="#9aa1ad" transform="rotate(40 74 20)"/>'
    + '<circle cx="50" cy="56" r="38" fill="url(#gPlate2)"/><circle cx="50" cy="56" r="31" fill="url(#gGolf)"/>'
    + '<g stroke="#2b3240" stroke-width="2">' + [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(function (a) { var p1 = ptAt(50, 56, 27, a), p2 = ptAt(50, 56, a % 90 ? 24 : 21, a); return '<path d="M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + '"/>'; }).join('') + '</g>'
    + '<path d="M50 56 L50 33" stroke="#d6262f" stroke-width="2.6" stroke-linecap="round"/><path d="M50 56 L64 62" stroke="#2b3240" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="56" r="3" fill="#2b3240"/>'
    + '<ellipse cx="38" cy="40" rx="11" ry="6" fill="#fff" opacity=".45" transform="rotate(-28 38 40)"/>';
}
function lunettes() {
  var verre = function (cx) { return '<ellipse cx="' + cx + '" cy="52" rx="19" ry="14" fill="#11183a" stroke="#1e50d6" stroke-width="5"/><ellipse cx="' + cx + '" cy="52" rx="15" ry="10" fill="url(#gVerre)"/><ellipse cx="' + (cx - 6) + '" cy="47" rx="6" ry="3" fill="#fff" opacity=".55"/>'; };
  return '<path d="M6 50 C2 40 12 36 12 50" fill="none" stroke="#1b1f2a" stroke-width="5"/><path d="M94 50 C98 40 88 36 88 50" fill="none" stroke="#1b1f2a" stroke-width="5"/>'
    + verre(30) + verre(70) + '<path d="M47 50 Q50 46 53 50" fill="none" stroke="#1e50d6" stroke-width="4"/>';
}
function gant() {
  return '<path d="M30 30 C30 14 46 10 60 12 C76 14 82 26 80 42 L78 62 C77 70 70 74 62 74 L40 74 C33 74 28 69 28 62 Z" fill="url(#gGant)"/>'
    + '<path d="M28 50 C18 50 14 40 22 34 C26 31 30 32 32 36" fill="url(#gGant)"/>'
    + '<rect x="32" y="72" width="34" height="20" rx="5" fill="#f4f5f7" stroke="#c9ced6"/><rect x="32" y="80" width="34" height="4" fill="#d6262f"/>'
    + '<path d="M42 30 C46 26 58 26 64 30" fill="none" stroke="#7a0f15" stroke-width="2" opacity=".5"/>'
    + '<ellipse cx="46" cy="24" rx="12" ry="5" fill="#fff" opacity=".35" transform="rotate(-12 46 24)"/>';
}

var ICONS = { muscu: haltere(), foot: foot(), combat: gant(), basket: basket(), tennis: tennis(), rugby: rugby(), natation: lunettes(), hand: hand(), athletisme: chrono(), volley: volley(), hockey: hockey(), kettlebell: kettlebell() };
var ORDRE = Object.keys(ICONS);
var SPORTS = [['mix', 'Mélange'], ['muscu', 'Muscu'], ['foot', 'Foot'], ['basket', 'Basket'], ['hand', 'Hand'], ['rugby', 'Rugby'], ['tennis', 'Tennis'], ['hockey', 'Hockey'], ['athletisme', 'Athlé'], ['natation', 'Natation'], ['combat', 'Combat']];
var SPORT = 'mix', reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function traits(k) {
  var t = document.createElement('div'); t.innerHTML = '<svg>' + ICONS[k] + '</svg>';
  t.querySelectorAll('*').forEach(function (el) {
    var f = el.getAttribute('fill') || '', op = parseFloat(el.getAttribute('opacity') || '1');
    if (/gShade/.test(f) || (op < .7 && el.tagName !== 'g')) el.remove();
  });
  return t.firstChild.innerHTML;
}

// Symbole « traits » d'un sport : on enlève couleurs et remplissages, tout en currentColor,
// chaque forme en pathLength=1 → l'effet « se dessine » se pilote par stroke-dashoffset (hérité).
function symbole(k) {
  var t = document.createElement('div'); t.innerHTML = '<svg>' + traits(k) + '</svg>';
  t.querySelectorAll('*').forEach(function (el) {
    ['fill', 'stroke', 'stroke-width', 'opacity', 'fill-opacity', 'filter'].forEach(function (a) { el.removeAttribute(a); });
    if (/^(path|circle|ellipse|rect|polygon|polyline|line)$/.test(el.tagName)) el.setAttribute('pathLength', 1);
  });
  return '<symbol id="s-' + k + '" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + t.firstChild.innerHTML + '</g></symbol>';
}
document.getElementById('syms').innerHTML = Object.keys(ICONS).map(symbole).join('');

var CELLS = [];
function grille() {
  var W = innerWidth, H = innerHeight, R = W < 600 ? 34 : 44;            // rayon d'une alvéole
  var w = Math.sqrt(3) * R, h = 1.5 * R, svg = document.getElementById('comb'), out = '', keys = suite(), n = 0;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  CELLS = [];
  for (var row = -1; row * h < H + R; row++) {
    for (var col = -1; col * w < W + w; col++) {
      var cx = col * w + (row % 2 ? w / 2 : 0), cy = row * h, pts = [];
      for (var i = 0; i < 6; i++) { var a = (60 * i - 90) * Math.PI / 180; pts.push((cx + R * Math.cos(a)).toFixed(1) + ',' + (cy + R * Math.sin(a)).toFixed(1)); }
      var k = keys[(n * 7 + row * 3) % keys.length], s = R * 1.08;
      out += '<g class="cell" id="c' + n + '"><polygon class="hc" points="' + pts.join(' ') + '"/><use href="#s-' + k + '" x="' + (cx - s / 2).toFixed(1) + '" y="' + (cy - s / 2).toFixed(1) + '" width="' + s.toFixed(1) + '" height="' + s.toFixed(1) + '"/></g>';
      CELLS.push({ x: cx, y: cy, on: false }); n++;
    }
  }
  svg.innerHTML = out;
  CELLS.forEach(function (c, i) { c.el = document.getElementById('c' + i); });
}
// Suite des sports dans la grille : le sport de la personne domine (1 alvéole sur 2), sinon tous.
function suite() { var all = Object.keys(ICONS); if (SPORT === 'mix') return all; var o = all.filter(function (k) { return k !== SPORT; }); var r = []; o.forEach(function (k) { r.push(SPORT, k); }); return r; }

// Deux « lumières » : le pointeur (souris / doigt / inclinaison) et une lueur qui se promène seule,
// pour que les sports apparaissent même sans interaction (téléphone posé).
var tx = -999, ty = -999, mx = -999, my = -999, active = 0;
addEventListener('pointermove', function (e) { tx = e.clientX; ty = e.clientY; active = performance.now(); });
addEventListener('pointerdown', function (e) { tx = e.clientX; ty = e.clientY; active = performance.now(); });
addEventListener('deviceorientation', function (e) { if (e.gamma != null && performance.now() - active > 1500) { tx = innerWidth * (.5 + Math.max(-1, Math.min(1, e.gamma / 35)) / 2); ty = innerHeight * (.5 + Math.max(-1, Math.min(1, (e.beta - 45) / 35)) / 2); } });
var B = document.querySelectorAll('.blob'), t0 = performance.now(), lastTick = 0, nextAmb = 0;
function rnd(a, b) { return a + Math.random() * (b - a); }
function allume(c, t, a, b) { c.on = true; c.until = t + rnd(a, b); c.el.classList.add('on'); }
(function frame(t) {
  var W = innerWidth, H = innerHeight, k = (t - t0) / 1000;
  if (mx < -900 && tx > -900) { mx = tx; my = ty; }
  mx += (tx - mx) * .12; my += (ty - my) * .12;
  var dx = (mx > -900 ? mx / W : .5) - .5, dy = (my > -900 ? my / H : .5) - .5;
  var amp = [[60, 40], [-50, 35], [40, -55], [-30, -30]];
  B.forEach(function (b, i) { var w = reduce ? 0 : Math.sin(k * (.08 + i * .02) + i) * 10; b.style.transform = 'translate(' + (dx * amp[i][0] + w) + 'vmax,' + (dy * amp[i][1] + w * .7) + 'vmax)'; });
  // Apparitions SPORADIQUES (retour 31/10) : quelques alvéoles seulement, au hasard, qui restent
  // allumées quelques secondes puis s'éteignent doucement. Près du pointeur : seulement quand il bouge.
  if (t - lastTick > 140) {
    lastTick = t;
    var R1 = W < 600 ? 120 : 170, bouge = (t - active) < 400;
    CELLS.forEach(function (c) {
      if (!c.on && bouge && Math.hypot(c.x - mx, c.y - my) < R1 && Math.random() < .045) allume(c, t, 2600, 4200);
      if (c.on && t > c.until) { c.on = false; c.el.classList.remove('on'); }
    });
    if (!reduce && t > nextAmb) { var c2 = CELLS[Math.floor(Math.random() * CELLS.length)]; if (!c2.on) allume(c2, t, 3500, 6000); nextAmb = t + rnd(700, 1500); }
  }
  requestAnimationFrame(frame);
})(t0);

var SPORTS = [['mix', 'Mélange'], ['muscu', 'Muscu'], ['foot', 'Foot'], ['basket', 'Basket'], ['hand', 'Hand'], ['rugby', 'Rugby'], ['tennis', 'Tennis'], ['hockey', 'Hockey'], ['athletisme', 'Athlé'], ['natation', 'Natation'], ['combat', 'Combat']];
function render() {
  document.getElementById('sports').innerHTML = SPORTS.map(function (s) { return '<button data-s="' + s[0] + '" class="' + (s[0] === SPORT ? 'on' : '') + '">' + s[1] + '</button>'; }).join('');
  document.getElementById('tag').textContent = SPORT === 'mix' ? 'Analyse · décide · progresse' : 'Le sport du dernier compte connecté sur cet appareil';
  grille();
}
document.getElementById('sports').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { SPORT = b.dataset.s; render(); } });
addEventListener('resize', grille);
var h = (location.hash || '').replace('#', ''); if (h) SPORT = h;
render();
</script>
