name: Déployer le backend — PRÉPROD

# 09/11/2026 — Déploie supabase/functions/handler/index.ts sur la PRÉPROD
# (projet Supabase « Novalyz Preprod », ref vqxkeqjaqkkmtzxvqvhi), sous le nom
# « smooth-service » (même nom qu'en prod), à chaque push sur dev qui touche
# le backend, ou à la main (Actions → Run workflow).
#
# ⚠️ PRÉPROD UNIQUEMENT. La prod (jhbrvgguybynzeceeceu) reste déployée À LA MAIN
# (coller index.ts dans Supabase), volontairement : rien ici ne peut la toucher
# (garde-fou ci-dessous).
#
# Pré-requis (une fois) : secret GitHub SUPABASE_ACCESS_TOKEN (jeton personnel
# Supabase : Account ▸ Access Tokens). Sans ce secret, le job est simplement
# sauté (pas d'échec).
on:
  push:
    branches: [dev]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PREPROD_REF: vqxkeqjaqkkmtzxvqvhi
    steps:
      - name: Secret absent → rien à faire
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN non configuré : déploiement préprod sauté."

      - name: Récupérer le code
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Préparer la fonction (nom smooth-service)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          # Garde-fou : on ne déploie JAMAIS ce workflow sur la prod.
          if [ "$PREPROD_REF" = "jhbrvgguybynzeceeceu" ]; then echo "Refus : ref de PROD"; exit 1; fi
          mkdir -p supabase/functions/smooth-service
          cp supabase/functions/handler/index.ts supabase/functions/smooth-service/index.ts
          # Config minimale éphémère (non versionnée) : pas de vérification JWT,
          # comme la fonction de prod (l'app gère sa propre session signée).
          printf 'project_id = "novalyz-preprod"\n\n[functions.smooth-service]\nverify_jwt = false\n' > supabase/config.toml

      - name: Déployer sur la préprod
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy smooth-service --project-ref "$PREPROD_REF" --no-verify-jwt --use-api
