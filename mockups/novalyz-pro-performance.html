<style>
/* Mise en page : bandeau marine (marque) + onglets d'analyste, contenu en cartes sur fond « blanc polaire » ; chiffres en mono tabulaire. */
:root{
  --bg:#F4F7FD; --surface:#FFFFFF; --surface2:#EDF2FD; --line:#D9E2F4;
  --text:#0A1222; --muted:#4A5980; --subtle:#8595B8;
  --accent:#1A5FFF; --accent-soft:rgba(26,95,255,.10); --accent-ink:#1248D4;
  --navy:#070B14; --on-navy:#F2F6FF; --on-navy-muted:#93A3C8;
  --adv:#A3AECA; --hl:#D13FC0;
  --good:#0B8F62; --good-soft:rgba(11,143,98,.12);
  --warn:#B26B00; --warn-soft:rgba(178,107,0,.12);
  --bad:#CF2836; --bad-soft:rgba(207,40,54,.10);
  --pitch:#E2F0E6; --pitch-line:#9CC7AB;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B14; --surface:#0E1526; --surface2:#141D33; --line:#24304E;
  --text:#E7EDFA; --muted:#9DABCC; --subtle:#6C7AA0;
  --accent:#5287FF; --accent-soft:rgba(82,135,255,.16); --accent-ink:#8FB0FF;
  --navy:#03060C; --adv:#5D6A8C; --hl:#F47CE6;
  --good:#34C88F; --good-soft:rgba(52,200,143,.14);
  --warn:#E8AA3C; --warn-soft:rgba(232,170,60,.14);
  --bad:#FF6672; --bad-soft:rgba(255,102,114,.14);
  --pitch:#0F2419; --pitch-line:#2E6045; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B14; --surface:#0E1526; --surface2:#141D33; --line:#24304E;
  --text:#E7EDFA; --muted:#9DABCC; --subtle:#6C7AA0;
  --accent:#5287FF; --accent-soft:rgba(82,135,255,.16); --accent-ink:#8FB0FF;
  --navy:#03060C; --adv:#5D6A8C; --hl:#F47CE6;
  --good:#34C88F; --good-soft:rgba(52,200,143,.14);
  --warn:#E8AA3C; --warn-soft:rgba(232,170,60,.14);
  --bad:#FF6672; --bad-soft:rgba(255,102,114,.14);
  --pitch:#0F2419; --pitch-line:#2E6045; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font:14px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:18px} h3{font-size:15px}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Bandeau */
header.top{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.06em}
.brand span{font-family:var(--f-display);color:#7FA6FF;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--on-navy-muted);padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:#1A5FFF;color:#fff}
.top label.role{display:flex;align-items:center;gap:6px;color:var(--on-navy-muted);font-size:12px}
.top select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 8px;color:var(--on-navy)}
.top select option{color:#0A1222}
nav.tabs{background:var(--navy);border-top:1px solid rgba(255,255,255,.08)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:var(--on-navy-muted);text-decoration:none;padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:#fff;border-color:#5C9AFF}

.demo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:10px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.demo-p{background:var(--hl);color:#fff}
.pill.v{background:var(--good-soft);color:var(--good)} .pill.d{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface2);color:var(--muted)}
.pill.w{background:var(--warn-soft);color:var(--warn)} .pill.a{background:var(--accent-soft);color:var(--accent-ink)}

main{padding-block:20px 48px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card > header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.card > header p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{color:var(--subtle);font-size:12px}
.muted{color:var(--muted)} .subtle{color:var(--subtle);font-size:12px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px;margin:10px 0 0}
.warnbox{background:var(--warn-soft);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px}
.warnbox b{color:var(--warn)}

.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:disabled{opacity:.45;cursor:not-allowed}
.btn.s{padding:4px 9px;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.f,input.f{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
input.f.formule{font-family:var(--f-mono);width:100%}

/* Duels de stats */
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.duel:last-child{border-bottom:0}
.duel .lbl{font-size:13px}
.duel .vals{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;white-space:nowrap}
.duel .bar{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.duel .bar i{display:block;height:100%}
.duel .moy{grid-column:1/-1;font-size:11.5px;color:var(--subtle)}

svg{display:block;width:100%;height:auto;max-width:100%}
svg text{fill:var(--muted);font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.zones{display:grid;gap:6px;margin-top:10px}
.zone{display:grid;grid-template-columns:minmax(0,1fr) 40px 90px;gap:8px;align-items:center;font-size:13px}
.zone .b{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.zone .b i{display:block;height:100%;background:var(--accent)}

/* Import */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:13px}
.steps li b{font-family:var(--f-mono);font-size:12px}
.steps li.on{background:var(--accent);color:#fff}
.steps li.ok{background:var(--good-soft);color:var(--good)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;display:grid;gap:10px;justify-items:start}
.sev-b{color:var(--bad);font-weight:600} .sev-v{color:var(--warn);font-weight:600}
.progress{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:5px}

/* IA */
.ia-ans{display:grid;gap:12px}
.ia-ans h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--f-body)}
.ia-ans ul{margin:4px 0 0;padding-left:18px;display:grid;gap:6px}
.ia-ans sup{color:var(--accent-ink);font-weight:600;font-family:var(--f-mono);font-size:10.5px}
.sources{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.sources ol{margin:4px 0 0;padding-left:20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.vars{display:flex;flex-wrap:wrap;gap:5px}
.vars button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:2px 7px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.up{color:var(--good);font-weight:600} .down{color:var(--bad);font-weight:600} .flat{color:var(--subtle)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;z-index:20}
@media (max-width:560px){.kpi .v{font-size:22px}.brand b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DATA={};
function genSport(sk){
 const S=SPORTS[sk],r=rng(S.seed),total=S.periodes*S.duree;
 const joueurs=S.roster.map(([nom,poste],i)=>({id:sk+'-'+i,i,num:S.nums[i],nom,poste,ind:.75+.5*r()}));
 const choisir=(type,mi)=>{let tot=0;const w=joueurs.map(j=>{let p=(S.poids[j.poste][type]||0)*j.ind;for(const t of S.tendances)if(mi>=4&&t.j===j.i&&t.types.includes(type))p*=t.f;tot+=p;return p});
  let x=r()*tot;for(let k=0;k<w.length;k++){x-=w[k];if(x<=0)return joueurs[k].id}return joueurs[joueurs.length-1].id};
 const matchs=[];
 for(let i=0;i<8;i++){
  const date=new Date(Date.UTC(2026,8,S.jour0+7*i)),f=.82+.42*r(),fa=.85+.35*r(),ev=[];
  const minute=()=>r()*total, per=m=>Math.min(S.periodes,Math.floor(m/S.duree)+1);
  const n=(rate,ff)=>Math.max(0,Math.round(rate*ff*(.75+.5*r())));
  const tirRes=(pb,e)=>{const x=r();e.res=x<pb?'but':x<pb+.38?'cadre':'non_cadre'};
  for(const side of ['nous','adv']){
   const ff=side==='nous'?f:fa;
   for(const [type,rate] of Object.entries(S.taux[side])){
    const cnt=n(rate,ff);
    for(let k=0;k<cnt;k++){
     const m=minute(),p=S.pos(type,r),e={side,type,min:m,per:per(m),x:p.x,y:p.y,j:side==='nous'?choisir(type,i):null};
     const T=S.types[type];
     if(type==='tir'){
      if(sk==='foot'){const d=Math.hypot(105-p.x,34-p.y);e.xg=Math.round(Math.min(.78,Math.max(.02,.95*Math.exp(-d/6.2)))*100)/100;tirRes(e.xg,e)}
      else tirRes(.14,e);
     }else if(T.res){e.res=type==='carton'?(r()<.8?T.res[0]:T.res[1]):(r()<(type==='duel'?.53:.36)?T.res[0]:T.res[1])}
     ev.push(e);
     if(sk==='hockey'&&type==='pc_obtenu'&&r()<.75){const q=S.pos('tir',r),t={side,type:'tir',min:Math.min(total-.01,m+.3),pc:true,x:q.x,y:q.y,j:side==='nous'?choisir('pc_obtenu',i):null};t.per=per(t.min);tirRes(.22,t);ev.push(t)}
    }
   }
  }
  ev.sort((a,b)=>a.min-b.min);
  matchs.push({id:i,date,adv:S.adversaires[i],dom:i%2===0,ev,version:1,source:i%3===2?'Dartfish (CSV)':'Nacsport (CSV)',exclues:[0,2,0,1,0,0,3,1][i]});
 }
 DATA[sk]={joueurs,matchs};
}

}

/* ===================== Métriques perso : formule sûre (aucun eval) ===================== */
function parseFormule(src,vars){
 const toks=[];const re=/\s*(?:(\d+(?:[.,]\d+)?)|([a-z_][a-z0-9_]*)|(.))/gy;let m;
 while(re.lastIndex<src.length&&(m=re.exec(src))){if(m[1])toks.push({t:'n',v:parseFloat(m[1].replace(',','.'))});else if(m[2])toks.push({t:'id',v:m[2]});else if(m[3]&&m[3].trim())toks.push({t:'op',v:m[3]})}
 let i=0;const peek=()=>toks[i],eat=v=>{if(peek()&&peek().v===v){i++;return true}return false};
 const FN={min:a=>Math.min(...a),max:a=>Math.max(...a),moyenne:a=>moy(a),ratio:a=>{if(a.length!==2)throw new Error('ratio(a, b) prend 2 valeurs');return a[1]?a[0]/a[1]*100:NaN},abs:a=>Math.abs(a[0])};
 function expr(){let n=term();for(;;){if(eat('+')){const a=n,b=term();n=c=>a(c)+b(c)}else if(eat('-')){const a=n,b=term();n=c=>a(c)-b(c)}else return n}}
 function term(){let n=fact();for(;;){if(eat('*')){const a=n,b=fact();n=c=>a(c)*b(c)}else if(eat('/')){const a=n,b=fact();n=c=>{const d=b(c);return d?a(c)/d:NaN}}else return n}}
 function fact(){const t=peek();if(!t)throw new Error('Formule incomplète');
  if(eat('-')){const a=fact();return c=>-a(c)}
  if(eat('(')){const a=expr();if(!eat(')'))throw new Error('Parenthèse fermante manquante');return a}
  if(t.t==='n'){i++;return()=>t.v}
  if(t.t==='id'){i++;if(eat('(')){if(!FN[t.v])throw new Error(`Fonction inconnue : ${t.v}`);const args=[];if(!eat(')')){do args.push(expr());while(eat(','));if(!eat(')'))throw new Error('Parenthèse fermante manquante')}const f=FN[t.v];return c=>f(args.map(a=>a(c)))}
   if(!vars.includes(t.v))throw new Error(`Variable inconnue : ${t.v}`);return c=>c[t.v]}
  throw new Error(`Symbole inattendu : ${t.v}`)}
 if(!toks.length)throw new Error('Formule vide');
 const f=expr();if(i<toks.length)throw new Error(`Symbole inattendu : ${toks[i].v}`);return f;
}
function rMetriques(){

  const ok=vals.filter(Number.isFinite),p=moy(vals.slice(0,4).filter(Number.isFinite)),d=moy(vals.slice(4).filter(Number.isFinite));
  const max=Math.max(...ok.map(Math.abs),1e-9);

   <div class="kpi"><div class="l">4 précédents → 4 derniers</div><div class="v">${fmt(p,1)} → ${fmt(d,1)}</div><div class="s">indicatif</div></div></div>
   <div class="tblw"><table><thead><tr><th>Match</th><th class="n">Valeur</th><th style="width:45%"></th></tr></thead><tbody>
   ${M.map((m,i)=>{const v=vals[i];return `<tr><td>${dcourt(m.date)} · ${esc(m.adv)}</td><td class="n">${Number.isFinite(v)?fmt(v,1):'<span class="subtle" title="Division par zéro">—</span>'}</td><td><div class="progress" style="height:8px"><i style="width:${Number.isFinite(v)?Math.abs(v)/max*100:0}%;background:${v<0?'var(--bad)':'var(--accent)'}"></i></div></td></tr>`}).reverse().join('')}
   </tbody></table></div>${vals.some(v=>!Number.isFinite(v))?'<p class="note">« — » : non calculable pour ce match (division par zéro), affiché tel quel plutôt qu’inventé.</p>':''}`;
 }catch(e){err=e.message}
 return `
 <section class="card"><header><h2>Créer une métrique</h2><p>Formule calculée par Novalyz sur les événements importés. Aucun code n'est exécuté.</p></header>
  <div class="row" style="margin-bottom:10px">${S.presets.map(([n,f],i)=>`<button class="chip" data-p="${i}" aria-pressed="${st.formule===f}">${esc(n)}</button>`).join('')}</div>

   <label for="mnom" class="subtle">Nom</label><input id="mnom" class="f" value="${esc(st.nomMetrique)}">
   <label for="mform" class="subtle">Formule</label><input id="mform" class="f formule" value="${esc(st.formule)}" spellcheck="false" autocomplete="off">
   <div id="merr" class="${err?'warnbox':''}">${err?`<b>À corriger :</b> ${esc(err)}`:''}</div>
   <div class="subtle">Variables (par match) — cliquer pour insérer :</div>
   <div class="vars">${S.vars.map(v=>`<button data-v="${v.k}" title="${esc(v.lbl)}">${v.k}</button>`).join('')}</div>
   <div class="subtle">Opérations : <code>+ − * /</code> · parenthèses · <code>ratio(a, b)</code> = a/b en % · <code>min</code> · <code>max</code> · <code>moyenne</code> · <code>abs</code></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn p" id="msave" ${err?'disabled':''}>Enregistrer la métrique</button></div></section>
 <section class="card"><header><h2>${esc(st.nomMetrique||'Résultat')}</h2><p class="mono">${esc(st.formule)}</p></header>${out||'<p class="muted">Corrige la formule pour voir le résultat.</p>'}</section>

}

/* ===================== Import : fichier → correspondance → vérification → import ===================== */
const CHAMPS={minute:{lbl:'Temps (mm:ss)',syn:['time','temps','minute','min','clock','chrono']},periode:{lbl:'Période',syn:['quarter','quart','half','mi-temps','periode','period']},equipe:{lbl:'Équipe',syn:['team','equipe','club']},type:{lbl:"Type d'événement",syn:['category','categorie','event','type','action','evenement']},joueur:{lbl:'Joueur',syn:['player','joueur','name','nom','athlete']},resultat:{lbl:'Résultat',syn:['outcome','result','resultat','issue']},phase:{lbl:'Phase de jeu',syn:['phase','set piece','situation'],sport:'hockey'},xg:{lbl:'xG',syn:['xg','expected goals'],sport:'foot'},x:{lbl:'Position X (%)',syn:['x','pos x']},y:{lbl:'Position Y (%)',syn:['y','pos y']},ignorer:{lbl:'— Ignorer —',syn:['clip','id','#']}};
const OBLIG=['minute','equipe','type'];
function champsSport(){return Object.entries(CHAMPS).filter(([k,c])=>!c.sport||c.sport===st.sport)}
function sampleCSV(){
 const S=Sx(),m=D().matchs[7],C=S.csv,rows=[];
 m.ev.forEach((e,i)=>{const r={Clip:i+1,Time:mmss(e.min),Quarter:e.per,Half:e.per,Team:e.side==='nous'?S.equipe:m.adv,Category:C.cat[e.type],Player:e.j?joueur(e.j).nom:'',Outcome:e.res?C.out[e.res]:'',Phase:e.type==='tir'?(e.pc?'PC':'Open play'):'',xG:e.xg!=null?e.xg.toFixed(2):'',X:(e.x/S.terrain.L*100).toFixed(1),Y:(e.y/S.terrain.H*100).toFixed(1)};rows.push(r)});
 const nous=rows.filter(r=>r.Team===S.equipe);
 const pick=k=>nous[Math.floor(nous.length*k)];

function parseCSV(txt){
 const l0=txt.split('\n')[0],d=(l0.match(/;/g)||[]).length>(l0.match(/,/g)||[]).length?';':(l0.includes('\t')?'\t':',');
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!==''));
}

 const total=S.periodes*S.duree,maxT=total+S.tol*S.periodes;
 const J=D().joueurs;
 I.data.forEach((r,ri)=>{
  const L=ri+2,add=(code,msg,sev,opts,val)=>iss.push({ri,L,code,msg,sev,opts,val});
  const sig=Object.entries(I.map).filter(([,k])=>k!=='ignorer').map(([i])=>r[i]).join('|');
  if(vus.has(sig))add('doublon',`Doublon de la ligne ${vus.get(sig)}`,'v',[['exclure','Exclure (doublon)'],['garder','Garder les deux']]);else vus.set(sig,L);
  const ty=r[c('type')];
  if(!ty)add('type',"Type d'événement manquant",'b',[['exclure','Exclure']]);
  else if(!I.vmap[norm(ty)])add('type',`Type inconnu « ${ty} »`,'b',[['exclure','Exclure']],"ou l'associer à un type à l'étape 2");

  else if(t<0||t>maxT)add('temps',`Temps ${r[c('minute')]} au-delà de la fin du match (${mmss(total)}${S.tol?` + ${S.tol} min tolérées par ${S.perPl.replace(/s$/,'')}`:''})`,'b',[['exclure','Exclure'],['garder','Importer quand même']]);
  else if(c('periode')>=0&&r[c('periode')]){const p=+r[c('periode')],pc=Math.min(S.periodes,Math.floor(t/S.duree)+1);

  for(const k of ['x','y']){if(c(k)>=0&&r[c(k)]!==''){const v=parseFloat(r[c(k)]);if(!(v>=0&&v<=100))add('pos',`Position ${k.toUpperCase()} = ${r[c(k)]} % hors du terrain (0 à 100)`,'v',[['sanspos','Importer sans position'],['exclure','Exclure']])}}
  if(c('xg')>=0&&r[c('xg')]!==''){const v=parseFloat(r[c('xg')]);if(!(v>=0&&v<=1))add('xg',`xG = ${r[c('xg')]} hors de 0 à 1`,'v',[['sansxg','Importer sans xG'],['exclure','Exclure']])}

 });
 iss.forEach(x=>{const k=x.ri+':'+x.code;if(!(k in I.dec))I.dec[k]=x.opts[0][0];x.k=k});
 return{iss,nousV,advV};

function fusion(){
 const I=st.imp,clips=new Map();let lignes=0;const dupCols=[];
 for(const f of I.fic){
  const first={};f.h.forEach((h,i)=>{const n=norm(h);if(n in first)dupCols.push({fic:f.nom,col:h,egal:f.data.every(r=>r[i]===r[first[n]])});else first[n]=i});
  for(const r of f.data){lignes++;const nm=(r[first.nom]||'').trim(),m=nm.match(/^(.*?)\s*\((\d+)\)\s*$/),pos=+r[first.position];
   const key=nm+'@'+pos;let c=clips.get(key);
   if(!c){c={key,nom:nm,cat:m?m[1]:nm,no:m?+m[2]:null,pos,dur:+r[first['duree:']??first.duree]||0,eq:'',mt:0,vals:{},src:[]};clips.set(key,c)}
   c.src.push(f.nom);
   for(const [n,i] of Object.entries(first)){const h=f.h[i],v=(r[i]||'').trim();
    if(n==='nom'||n==='position'||n==='duree:'||n==='duree')continue;
    if(n==='equipe'){c.eq=c.eq||v;continue} if(n==='mt'){const mm=v.match(/^(\d)/);c.mt=c.mt||(mm?+mm[1]:0);continue}
    if(n in CLIP_ROLES)continue;
    (c.vals[h]=c.vals[h]||{});(c.vals[h][v]=c.vals[h][v]||[]).push(f.nom)}}
 }
 const L=[...clips.values()].sort((a,b)=>a.pos-b.pos),conf=[];
 for(const c of L)for(const [col,vs] of Object.entries(c.vals))if(Object.keys(vs).length>1)conf.push({k:c.key+'|'+col,c,col,vs});
 const cnt={};for(const c of L)cnt[c.eq]=(cnt[c.eq]||0)+1;const nous=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
 const adv=Object.keys(cnt).find(e=>e!==nous)||'';
 return{L,lignes,conf,dupCols,nous,adv};
}
function val(c,col){const vs=c.vals[col];if(!vs)return '';const ks=Object.keys(vs);if(ks.length===1)return ks[0];const d=st.imp&&st.imp.dec[c.key+'|'+col];return d!==undefined?d:(c.res?c.res[col]:undefined)}

}
function rClipMatch(){
 const {F,ko1,ko2}=st.clipMatch,G=GAB_CLUB,v=(c,col)=>(c.res&&c.res[col])||'';
 const poss=F.L.filter(c=>c.eq===F.nous&&v(c,G.entree));
 const entrees=poss.reduce((s,c)=>s+(+v(c,G.entree)||0),0);
 const compte=(arr,col)=>{const o={};for(const c of arr){const x=v(c,col)||'Non renseigné';o[x]=(o[x]||0)+1}return o};
 const res=compte(poss,G.resultat),sit=compte(poss,G.situation);
 const renseig=poss.filter(c=>v(c,G.resultat)).length,dang=poss.filter(c=>/dangereuse|d[ée]cisive/i.test(v(c,G.resultat))).length;
 const somme=(eq,col)=>F.L.filter(c=>c.eq===eq).reduce((s,c)=>s+(+v(c,col)||0),0);
 const buts=eq=>F.L.filter(c=>c.eq===eq&&v(c,G.tir)==='But').length;
 const mts=[1,2].map(mt=>{const p=poss.filter(c=>c.mt===mt);return{mt,poss:p.length,ent:p.reduce((s,c)=>s+(+v(c,G.entree)||0),0),dang:p.filter(c=>/dangereuse|d[ée]cisive/i.test(v(c,G.resultat))).length,rens:p.filter(c=>v(c,G.resultat)).length,pertes:p.filter(c=>v(c,G.situation)==='Perte de balle').length}});
 const barresH=o=>{const tot=Object.values(o).reduce((s,x)=>s+x,0);return `<div class="zones">${Object.entries(o).sort((a,b)=>(a[0]==='Non renseigné')-(b[0]==='Non renseigné')||b[1]-a[1]).map(([k,n])=>`<div class="zone"><span${k==='Non renseigné'?' class="subtle"':''}>${esc(k)}</span><span class="num" style="text-align:right">${n}</span><span class="b"><i style="width:${n/tot*100}%;${k==='Non renseigné'?'background:var(--subtle)':''}"></i></span></div>`).join('')}</div>`};
 const cale=Number.isFinite(ko1)&&Number.isFinite(ko2);
 const t0=Math.min(...F.L.map(c=>c.pos))-60000,t1=Math.max(...F.L.map(c=>c.pos+c.dur))+60000,W=1000,H=130,Lm=58,x=t=>Lm+(W-Lm-12)*(t-t0)/(t1-t0);
 const fin1=Math.max(...F.L.filter(c=>c.mt===1).map(c=>c.pos)),deb2=Math.min(...F.L.filter(c=>c.mt===2).map(c=>c.pos));
 const col=r=>/d[ée]cisive/i.test(r)?'var(--good)':/dangereuse/i.test(r)?'var(--accent)':r?'var(--subtle)':'none';
 let tl=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Clips sur le temps vidéo"><rect x="${x(fin1)+6}" y="14" width="${Math.max(0,x(deb2)-x(fin1)-12)}" height="${H-40}" fill="var(--surface2)"/><text x="${(x(fin1)+x(deb2))/2}" y="${H/2-4}" text-anchor="middle" font-size="11">entre les mi-temps</text>`;
 for(let t=Math.ceil(t0/900000)*900000;t<=t1;t+=900000)tl+=`<line x1="${x(t)}" x2="${x(t)}" y1="14" y2="${H-26}" stroke="var(--line)"/><text x="${x(t)}" y="${H-10}" text-anchor="middle" font-size="10.5">${vms(t)}</text>`;
 tl+=`<line x1="${Lm}" x2="${W-12}" y1="62" y2="62" stroke="var(--line)"/><text x="4" y="40" font-size="11.5" font-weight="600">${esc(F.nous)}</text><text x="4" y="94" font-size="11.5">${esc(F.adv)}</text>`;
 for(const c of F.L){const xx=x(c.pos).toFixed(1),tip=`${c.nom} · ${vms(c.pos)} vidéo${cale?' · '+fmt(minuteJeu(c,ko1,ko2),0)+"' de jeu":''} · ${Object.entries(c.res).filter(([,y])=>y).map(([k,y])=>k+' : '+y).join(' · ')}`;
  if(c.eq===F.nous){const r=v(c,G.resultat);tl+=`<circle cx="${xx}" cy="38" r="${v(c,G.entree)?6:3}" fill="${v(c,G.entree)?col(r):'var(--adv)'}" stroke="${r?'none':'var(--accent)'}" stroke-width="1.5"><title>${esc(tip)}</title></circle>`}
  else{const but=v(c,G.tir)==='But';tl+=`<circle cx="${xx}" cy="90" r="${but?7:4}" fill="${but?'var(--bad)':'var(--adv)'}"><title>${esc(tip)}</title></circle>`}}
 tl+='</svg>';
 return `
 <section class="card"><div class="row" style="justify-content:space-between">
  <div><div class="subtle">Import réel · ${F.L.length} clips · équipes anonymisées</div>
  <h1 style="font-size:24px;margin-top:4px">${esc(F.nous)} – ${esc(F.adv)}</h1>
  <div class="row" style="margin-top:6px"><span class="pill w">Score non reconstitué</span><span class="subtle">Les fichiers ne contiennent que ${buts(F.nous)+buts(F.adv)} but(s) (${esc(F.adv)} ${buts(F.adv)}, ${esc(F.nous)} ${buts(F.nous)}) et pas tous les tirs. Le « Panneau de score » reste à 0:0.</span></div></div>
  ${selMatch()}</div></section>
 <div class="kpis">
  <div class="kpi"><div class="l">Entrées dans les 30 m</div><div class="v">${entrees}</div><div class="s">sur ${poss.length} possessions</div></div>
  <div class="kpi"><div class="l">Entrées dangereuses ou décisives</div><div class="v">${fmt(dang/renseig*100)} %</div><div class="s">${dang} sur ${renseig} renseignées (${poss.length-renseig} sans résultat)</div></div>
  <div class="kpi"><div class="l">Passes vers la surface</div><div class="v">${somme(F.nous,G.pvs)}</div><div class="s">${esc(F.adv)} : ${somme(F.adv,G.pvs)}</div></div>
  <div class="kpi"><div class="l">Passes dans la surface</div><div class="v">${somme(F.nous,G.ps)}</div><div class="s">${esc(F.adv)} : ${somme(F.adv,G.ps)}</div></div>
 </div>
 <div class="grid g2">
  <section class="card"><header><h2>Résultat des entrées</h2><p>${esc(G.resultat)}</p></header>${barresH(res)}</section>
  <section class="card"><header><h2>Ce qui suit l'entrée</h2><p>${esc(G.situation)}</p></header>${barresH(sit)}</section>
 </div>
 <section class="card"><header><h2>Par mi-temps · ${esc(F.nous)}</h2></header><div class="tblw"><table><thead><tr><th></th><th class="n">1re MT</th><th class="n">2e MT</th></tr></thead><tbody>
  <tr><td>Entrées dans les 30 m</td>${mts.map(m=>`<td class="n">${m.ent}</td>`).join('')}</tr>
  <tr><td>Dangereuses ou décisives</td>${mts.map(m=>`<td class="n">${m.dang} / ${m.rens}</td>`).join('')}</tr>
  <tr><td>Terminées par une perte de balle</td>${mts.map(m=>`<td class="n">${m.pertes}</td>`).join('')}</tr></tbody></table></div>
  <p class="note">« Dangereuses ou décisives » est rapporté aux entrées dont le résultat est renseigné, jamais au total.</p></section>
 <section class="card"><header><h2>Clips dans le temps</h2><p>${cale?'Temps calé sur les coups d’envoi':'Temps vidéo (non calé)'}</p></header><div class="tblw">${tl}</div>
  <div class="legend"><span><i style="background:var(--good)"></i>Entrée décisive</span><span><i style="background:var(--accent)"></i>Dangereuse</span><span><i style="background:var(--subtle)"></i>Neutre</span><span><i style="border:1.5px solid var(--accent)"></i>Sans résultat</span><span><i style="background:var(--bad)"></i>But adverse</span></div></section>
 <section class="card"><header><h2>Clips</h2><p>Chaque clip garde ses descripteurs d'origine</p></header><div class="tblw"><table><thead><tr><th>Clip</th><th class="n">Vidéo</th>${cale?'<th class="n">Jeu</th>':''}<th class="n">Durée</th><th>Équipe</th><th>MT</th><th>Descripteurs</th></tr></thead><tbody>
 ${F.L.map(c=>`<tr><td style="white-space:nowrap"><b>${esc(c.nom)}</b></td><td class="n">${vms(c.pos)}</td>${cale?`<td class="n">${fmt(minuteJeu(c,ko1,ko2),0)}'</td>`:''}<td class="n" style="white-space:nowrap">${fmt(c.dur/1000,0)} s</td><td style="white-space:nowrap">${esc(c.eq)}</td><td>${c.mt}</td><td style="font-size:12px">${Object.entries(c.res).filter(([,y])=>y).map(([k,y])=>`<span class="pill n" style="margin:1px">${esc(k)} : ${esc(y)}</span>`).join(' ')}</td></tr>`).join('')}
 </tbody></table></div>
 <p class="note">Pas de colonne joueur dans ce marquage : pas de fiche individuelle pour ce match. Le sens de chaque descripteur (ex. « ${esc(G.resultat)} ») est défini dans le gabarit, pas dans le moteur.</p></section>`;
}

/* ===================== Analyse IA (exemple de rendu, chiffres calculés par Novalyz) ===================== */
function rIA(){
 const S=Sx(),M=D().matchs;
 const qs=st.role==='joueur'?[['moi','Mon dernier match']]:[['resume','Résume le match'],['periode',`Quel ${st.sport==='hockey'?'quart-temps':'moment'} a posé problème ?`],['progres','Qui progresse sur les 4 derniers matchs ?']];
 if(!qs.some(q=>q[0]===st.iaQ))st.iaQ=qs[0][0];
 const A=iaReponse(st.iaQ);
 return `
 <section class="card"><header><h2>Poser une question</h2>
  ${st.role==='joueur'?'':`<label class="row subtle" for="iam">Match <select id="iam" class="f">${M.map((x,i)=>`<option value="${i}" ${i===st.match?'selected':''}>${dcourt(x.date)} · ${esc(x.adv)}</option>`).reverse().join('')}</select></label>`}</header>
  <div class="row">${qs.map(([k,l])=>`<button class="chip" data-q="${k}" aria-pressed="${k===st.iaQ}">${esc(l)}</button>`).join('')}</div>
  <p class="note">Exemple de rendu. Novalyz calcule d'abord les chiffres (ci-dessous, avec leurs sources) ; l'IA ne fait que les formuler et ne peut pas en ajouter : tout nombre absent des données est refusé. Elle sépare ce qui est observé de ce qui est une piste, et dit ce qui manque.</p></section>
 <section class="card ia-ans">${A}</section>`;
}
function iaReponse(q){
 const S=Sx(),M=D().matchs,src=[],cite=t=>{src.push(t);return `<sup>[${src.length}]</sup>`};
 const m=M[typeof st.match==='number'?st.match:7],c=calc(m),autres=M.filter(x=>x!==m).map(x=>calc(x)),mo=k=>moy(autres.map(o=>o[k]));
 const H=st.sport==='hockey',ent=H?'entrees_cercle':'entrees_surface',entL=H?'entrées dans le cercle':'entrées dans la surface';
 const per=[];for(let p=1;p<=S.periodes;p++)per.push(calc(m,e=>e.per===p));
 const solde=per.map(p=>p[ent]-p['adv_'+ent]);const pire=solde.indexOf(Math.min(...solde));
 const sources=()=>`<div class="sources"><b>Sources (calculées par Novalyz)</b><ol>${src.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
 const res=resultat(c),titre=`${S.equipe} ${c.buts}–${c.adv_buts} ${m.adv} · ${dfr(m.date)}`;
 if(q==='resume'){
  const obs=[`${RLBL[res]} ${c.buts}–${c.adv_buts}${cite(`Événements « Tir » avec résultat « But » : ${c.buts} pour, ${c.adv_buts} contre.`)}.`,
   `${c.tirs} tirs dont ${c.tirs_cadres} cadrés, contre ${c.adv_tirs} tirs adverses${cite(`Événements « Tir » du match : ${c.tirs} (${S.equipe}), ${c.adv_tirs} (${m.adv}).`)}.`,
   `${entL[0].toUpperCase()+entL.slice(1)} : ${c[ent]} contre ${c['adv_'+ent]} ; moyenne des 7 autres matchs : ${fmt(mo(ent),1)}${cite(`Événements « ${S.types[H?'entree_cercle':'entree_surface'].lbl} » du match et des 7 autres matchs.`)}.`];
  if(H)obs.push(`Corners courts : ${c.pc_obtenus} obtenus, ${c.buts_pc} transformé${c.buts_pc>1?'s':''} ; ${c.adv_pc} concédés${cite(`Événements « Corner court obtenu » (${c.pc_obtenus}) et tirs marqués sur corner court (${c.buts_pc}) ; corners adverses (${c.adv_pc}).`)}.`);
  else obs.push(`xG : ${fmt(c.xg,2)} pour, ${fmt(c.adv_xg,2)} contre${cite(`Somme des xG des ${c.tirs} tirs de ${S.equipe} et des ${c.adv_tirs} tirs adverses (colonne xG du fichier).`)}.`);
  obs.push(`${S.long(pire+1)} : ${entL} ${per[pire][ent]} contre ${per[pire]['adv_'+ent]} ; pertes de balle : ${per[pire].pertes} sur ${c.pertes} dans le match${cite(`Mêmes événements, filtrés sur la période ${S.court(pire+1)}.`)}.`);
  const pistes=[];
  if(H&&c.pc_obtenus){const tx=c.buts_pc/c.pc_obtenus*100,txs=autres.reduce((s,o)=>s+o.buts_pc,0)/Math.max(1,autres.reduce((s,o)=>s+o.pc_obtenus,0))*100;
   pistes.push(`Conversion des corners courts : ${fmt(tx)} % ce match, ${fmt(txs)} % sur les 7 autres. ${tx<txs?'À revoir en vidéo sur ces '+c.pc_obtenus+' corners (routine, premier tir).':'Point fort à conserver.'} Sur un seul match, l'écart peut tenir au hasard.`)}
  if(!H){const d=c.buts-c.xg;pistes.push(`Finition : ${c.buts} buts pour ${fmt(c.xg,2)} xG (${d>=0?'+':'−'}${fmt(Math.abs(d),2)}). Sur un match, cet écart dit peu de la qualité de finition.`)}
  pistes.push(`${S.long(pire+1)} : piste à vérifier en vidéo (fatigue, rotation, pressing adverse ?). Les données d'événements seules ne permettent pas de trancher.`);
  return `<header><h2>${esc(titre)}</h2></header><div><h3>Observé</h3><ul>${obs.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div><h3>Pistes (interprétation)</h3><ul>${pistes.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div><h3>Ce qui manque</h3><ul><li>Pas de GPS ni de vidéo liée : rien sur l'intensité physique.</li><li>Pas de temps de jeu par joueur dans ce fichier : les chiffres individuels ne sont pas rapportés aux minutes jouées.</li></ul></div>${sources()}`;
 }
 if(q==='periode'){
  const rows=per.map((p,i)=>`<li><b>${S.court(i+1)}</b> : ${entL} ${p[ent]}–${p['adv_'+ent]}, tirs ${p.tirs}–${p.adv_tirs}, pertes ${p.pertes}${cite(`Événements du ${S.long(i+1)}.`)}</li>`).join('');
  const meilleur=solde.indexOf(Math.max(...solde));
  return `<header><h2>${esc(titre)}</h2></header><div><h3>Observé</h3><ul>${rows}</ul></div>
   <div><h3>Lecture</h3><ul><li>Solde des ${entL} le plus faible : <b>${S.long(pire+1)}</b> (${solde[pire]>0?'+':''}${solde[pire]}). Le meilleur : ${S.long(meilleur+1)} (${solde[meilleur]>0?'+':''}${solde[meilleur]}).</li>
   <li>Avec ${S.periodes} périodes et des effectifs de quelques événements, une différence de 1 ou 2 n'est pas significative : à croiser avec la vidéo avant d'en tirer une conclusion.</li></ul></div>${sources()}`;
 }
 if(q==='progres'){
  const J=D().joueurs,cands=[];
  for(const j of J)for(const k of S.joueurCles){const x=comparer(j,k),seuil=V(k).dec?.1:1;if(Math.abs(x.diff)>=seuil){const bien=(x.diff>0)!==!!V(k).inv;cands.push({j,k,x,bien,score:Math.abs(x.diff)/Math.max(.5,x.p)})}}
  const up=cands.filter(c=>c.bien).sort((a,b)=>b.score-a.score).slice(0,3),dn=cands.filter(c=>!c.bien).sort((a,b)=>b.score-a.score).slice(0,2);
  const li=c=>`<li><b>${esc(c.j.nom)}</b> (${c.j.poste}) — ${esc(V(c.k).lbl.toLowerCase())} : ${fmt(c.x.p,V(c.k).dec||1)} → ${fmt(c.x.d,V(c.k).dec||1)} par match${cite(`${esc(c.j.nom)}, « ${esc(V(c.k).lbl)} » sur les matchs du ${dcourt(M[0].date)} au ${dcourt(M[3].date)} puis du ${dcourt(M[4].date)} au ${dcourt(M[7].date)}.`)}</li>`;
  return `<header><h2>Évolution sur 8 matchs</h2></header><div><h3>En progrès</h3><ul>${up.map(li).join('')||'<li>Aucun écart d\'au moins une action par match.</li>'}</ul></div>
   <div><h3>À surveiller</h3><ul>${dn.map(li).join('')||'<li>Rien à signaler.</li>'}</ul></div>
   <div><h3>Limites</h3><ul><li>4 matchs contre 4 : tendance indicative. Le temps de jeu n'est pas dans les fichiers ; un joueur qui joue plus fait mécaniquement plus d'actions.</li></ul></div>${sources()}`;
 }
 if(q==='moi'){
  const j=D().joueurs[S.moi],cj=calc(m,e=>e.j===j.id);
  const li=S.joueurCles.map(k=>{const mo2=moy(M.filter(x=>x!==m).map(x=>calc(x,e=>e.j===j.id)[k]));return `<li>${esc(V(k).lbl)} : <b>${fmt(cj[k],V(k).dec||0)}</b> (ta moyenne sur les autres matchs : ${fmt(mo2,V(k).dec||1)})${cite(`Tes événements « ${esc(V(k).lbl)} » du ${dcourt(m.date)} et des 7 autres matchs.`)}</li>`}).join('');
  return `<header><h2>${esc(j.nom)} · ${esc(titre)}</h2></header><div><h3>Observé</h3><ul>${li}</ul></div>
   <div><h3>Ce qui manque</h3><ul><li>Ton temps de jeu n'est pas dans le fichier : à minutes égales, la comparaison serait plus juste.</li></ul></div>${sources()}`;
 }
 return '';
}
bind.ia=()=>{
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{st.iaQ=b.dataset.q;render()});
 const s=$('#iam');if(s)s.onchange=e=>{st.match=+e.target.value;render()};
};

/* ===================== Démarrage ===================== */
$('#role').value=st.role;
go(location.hash.slice(1)||'apercu');
</script>
