name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Ensure gh-pages directory exists
        run: mkdir -p gh-pages/dev

      - name: Copy index.html to correct location
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            cp index.html gh-pages/index.html
          else
            cp index.html gh-pages/dev/index.html
          fi

      - name: Commit and push gh-pages branch
        run: |
          cd gh-pages
          git init || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Deploy ${{ github.ref_name }} @ ${{ github.sha }}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact from gh-pages directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
