<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login animé — maquette</title>
<style>
  :root{ --nv-grad:linear-gradient(180deg,#ffffff 0%,#ffffff 34%,#eaf0ff 52%,#7aa3ff 74%,#1A5FFF 100%); --accent:#1A5FFF; --text:#0d1424; --muted:#5f6b85; --border:#dde4f3; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  body{background:var(--nv-grad);min-height:100vh;overflow:hidden}
  /* Sélecteur de variante (maquette seulement) */
  .pick{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:5px;box-shadow:0 6px 18px rgba(13,20,36,.1)}
  .pick button{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
  .pick button.on{background:var(--accent);color:#fff}
  /* Fond animé */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .it{position:absolute;left:0;top:0;will-change:transform;animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
  .it svg{display:block;width:var(--s);height:var(--s);fill:none;stroke-linecap:round;stroke-linejoin:round;animation:spin var(--r) linear infinite}
  .it .u{stroke:rgba(26,95,255,.22);stroke-width:3.6}
  .it .o{stroke:rgba(255,255,255,.85);stroke-width:1.6}
  @keyframes drift{
    0%  {transform:translate(var(--x0),var(--y0))}
    25% {transform:translate(var(--x1),var(--y1))}
    50% {transform:translate(var(--x2),var(--y2))}
    75% {transform:translate(var(--x3),var(--y3))}
    100%{transform:translate(var(--x0),var(--y0))}
  }
  @keyframes spin{to{transform:rotate(var(--rot))}}
  @media (prefers-reduced-motion:reduce){ .it,.it svg{animation:none} }
  /* Carte de connexion (reprend la page actuelle, simplifiée) */
  .login{position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
  .brand{font-size:30px;letter-spacing:.32em;font-weight:900;margin-bottom:6px}
  .brand b{color:var(--accent)}
  .tag{font-size:13px;color:var(--muted);margin-bottom:22px}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 14px 40px rgba(13,20,36,.12)}
  .card label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
  .card input{width:100%;border:1px solid var(--border);background:#f3f6fd;border-radius:11px;padding:12px;font:inherit;font-size:15px}
  .card button{width:100%;margin-top:16px;border:none;border-radius:13px;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:13px}
  .note{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;font-size:11.5px;color:#fff;background:rgba(13,20,36,.55);border-radius:999px;padding:6px 12px;white-space:nowrap}
</style>
</head>
<body>
<div class="pick" id="pick">
  <button data-v="A">A · Haltères</button>
  <button data-v="B" class="on">B · Haltères + ballons</button>
  <button data-v="C">C · Léger</button>
</div>
<div class="sky" id="sky"></div>
<div class="login">
  <div class="brand">NOVA<b>LYZ</b></div>
  <div class="tag">Analyse · décide · progresse</div>
  <div class="card">
    <label>Identifiant</label><input placeholder="1234">
    <label>Mot de passe</label><input type="password" placeholder="••••••">
    <button>Se connecter</button>
  </div>
</div>
<div class="note" id="note"></div>
<script>
// Icônes dessinées pour la maquette (traits simples, aucun logo de marque).
var ICONS = {
  haltere: '<path d="M2 12h20"/><rect x="4" y="7" width="3" height="10" rx="1"/><rect x="17" y="7" width="3" height="10" rx="1"/><rect x="1.5" y="9" width="2" height="6" rx=".8"/><rect x="20.5" y="9" width="2" height="6" rx=".8"/>',
  foot: '<circle cx="12" cy="12" r="9.5"/><path d="M12 8.2l3.2 2.3-1.2 3.8h-4l-1.2-3.8z"/><path d="M12 8.2V3M15.2 10.5l4.6-1.6M14 14.3l2.8 4M10 14.3l-2.8 4M8.8 10.5L4.2 8.9"/>',
  basket: '<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5v19"/><path d="M5.3 5.3c3 3 3 10.4 0 13.4M18.7 5.3c-3 3-3 10.4 0 13.4"/>',
  rugby: '<ellipse cx="12" cy="12" rx="10" ry="6" transform="rotate(-35 12 12)"/><path d="M8.5 15.5l7-7"/><path d="M10 11.6l1.4 1.4M11.6 10l1.4 1.4M13.2 8.4l1.4 1.4"/>',
  tennis: '<circle cx="12" cy="12" r="9.5"/><path d="M4.5 6.5c4 2.5 4 8.5 0 11M19.5 6.5c-4 2.5-4 8.5 0 11"/>',
  hand: '<circle cx="12" cy="12" r="9.5"/><path d="M12 2.5c-2 3-2 6 0 9.5s2 6.5 0 9.5"/><path d="M3 9c3.5.5 6 1.5 9 3s5.5 2.5 9 3"/>',
  volley: '<circle cx="12" cy="12" r="9.5"/><path d="M12 12c0-4 2-7.5 6-9M12 12c-3.5 2-7.5 2.2-10 .5M12 12c3.5 2 5.5 5.5 5.5 8.5"/>'
};
var SETS = {
  A: { n: 11, kinds: ['haltere'] },
  B: { n: 14, kinds: ['haltere', 'haltere', 'foot', 'basket', 'rugby', 'tennis', 'hand', 'volley'] },
  C: { n: 7, kinds: ['haltere', 'foot', 'basket', 'rugby', 'tennis', 'hand', 'volley'] }
};
var NOTES = { A: 'A · 11 haltères qui flottent lentement', B: 'B · 14 objets : haltères + foot, basket, rugby, tennis, hand, volley', C: 'C · 7 objets, plus discret' };
function rnd(a, b) { return a + Math.random() * (b - a); }
function build(v) {
  var sky = document.getElementById('sky'), S = SETS[v], W = innerWidth, H = innerHeight, html = '';
  for (var i = 0; i < S.n; i++) {
    var k = S.kinds[i % S.kinds.length], s = Math.round(rnd(26, v === 'C' ? 44 : 56));
    var pt = function () { return [Math.round(rnd(-40, W - 10)) + 'px', Math.round(rnd(-40, H - 10)) + 'px']; };
    var p0 = pt(), p1 = pt(), p2 = pt(), p3 = pt();
    var st = '--s:' + s + 'px;--d:' + rnd(28, 46).toFixed(1) + 's;--dl:-' + rnd(0, 40).toFixed(1) + 's;--r:' + rnd(18, 40).toFixed(1) + 's;--rot:' + (Math.random() < .5 ? '-' : '') + '360deg;'
      + '--x0:' + p0[0] + ';--y0:' + p0[1] + ';--x1:' + p1[0] + ';--y1:' + p1[1] + ';--x2:' + p2[0] + ';--y2:' + p2[1] + ';--x3:' + p3[0] + ';--y3:' + p3[1];
    html += '<div class="it" style="' + st + '"><svg viewBox="0 0 24 24"><g class="u">' + ICONS[k] + '</g><g class="o">' + ICONS[k] + '</g></svg></div>';
  }
  sky.innerHTML = html;
  document.getElementById('note').textContent = NOTES[v];
  document.querySelectorAll('#pick button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
}
document.getElementById('pick').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) build(b.dataset.v); });
var q = (location.hash || '').replace('#', '').toUpperCase();
build(SETS[q] ? q : 'B');
</script>
</body>
</html>
