<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login animé réaliste — maquette</title>
<style>
  :root{ --nv-grad:linear-gradient(180deg,#ffffff 0%,#ffffff 34%,#eaf0ff 52%,#7aa3ff 74%,#1A5FFF 100%); --accent:#1A5FFF; --text:#0d1424; --muted:#5f6b85; --border:#dde4f3; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
  body{background:var(--nv-grad);min-height:100vh;overflow:hidden}
  .pick{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:5px;box-shadow:0 6px 18px rgba(13,20,36,.1);white-space:nowrap}
  .pick button{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
  .pick button.on{background:var(--accent);color:#fff}
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .it{position:absolute;left:0;top:0;will-change:transform;animation:drift var(--d) linear infinite;animation-delay:var(--dl);opacity:var(--op)}
  .it svg{display:block;width:var(--s);height:var(--s);animation:spin var(--r) linear infinite;filter:drop-shadow(0 6px 8px rgba(13,20,36,.22))}
  @keyframes drift{0%{transform:translate(var(--x0),var(--y0))}25%{transform:translate(var(--x1),var(--y1))}50%{transform:translate(var(--x2),var(--y2))}75%{transform:translate(var(--x3),var(--y3))}100%{transform:translate(var(--x0),var(--y0))}}
  @keyframes spin{to{transform:rotate(var(--rot))}}
  @media (prefers-reduced-motion:reduce){.it,.it svg{animation:none}}
  .login{position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
  .brand{font-size:30px;letter-spacing:.32em;font-weight:900;margin-bottom:6px}
  .brand b{color:var(--accent)}
  .tag{font-size:13px;color:var(--muted);margin-bottom:22px}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 14px 40px rgba(13,20,36,.12)}
  .card label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
  .card input{width:100%;border:1px solid var(--border);background:#f3f6fd;border-radius:11px;padding:12px;font:inherit;font-size:15px}
  .card button{width:100%;margin-top:16px;border:none;border-radius:13px;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:13px}
  /* Planche des icônes (gros plan) */
  .board{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:22px;padding:70px 20px 20px;background:linear-gradient(90deg,#fff 0 50%,#1A5FFF 50%)}
  .board.on{display:flex}
  .board figure{margin:0;text-align:center;font-size:12px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.85);border-radius:14px;padding:10px 12px}
  .board svg{width:120px;height:120px;display:block;filter:drop-shadow(0 6px 8px rgba(13,20,36,.22))}
</style>
</head>
<body>
<!-- Dégradés partagés par toutes les icônes (dessins maison, aucun logo de marque) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gFoot" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#eef0f4"/><stop offset="1" stop-color="#b9bfca"/></radialGradient>
    <radialGradient id="gPenta" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#0c0e13"/></radialGradient>
    <radialGradient id="gBasket" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#ffb066"/><stop offset=".55" stop-color="#ef7d2c"/><stop offset="1" stop-color="#a94812"/></radialGradient>
    <radialGradient id="gRugby" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#c98454"/><stop offset=".6" stop-color="#9a5226"/><stop offset="1" stop-color="#5e2c10"/></radialGradient>
    <radialGradient id="gTennis" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#f4ff8a"/><stop offset=".6" stop-color="#d4e83a"/><stop offset="1" stop-color="#93a512"/></radialGradient>
    <radialGradient id="gWhite" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef1f6"/><stop offset="1" stop-color="#bcc3cf"/></radialGradient>
    <radialGradient id="gShade" cx="36%" cy="30%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f5"/><stop offset=".5" stop-color="#a7afba"/><stop offset="1" stop-color="#6b737e"/></linearGradient>
    <linearGradient id="gPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f5a"/><stop offset=".5" stop-color="#1f2229"/><stop offset="1" stop-color="#0b0c10"/></linearGradient>
    <linearGradient id="gPlate2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c7380"/><stop offset="1" stop-color="#2a2e36"/></linearGradient>
    <radialGradient id="gKb" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#5a606b"/><stop offset=".6" stop-color="#23262d"/><stop offset="1" stop-color="#0b0c10"/></radialGradient>
    <radialGradient id="gGolf" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef0f3"/><stop offset="1" stop-color="#b7bdc7"/></radialGradient>
    <linearGradient id="gPuck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f47"/><stop offset="1" stop-color="#090a0d"/></linearGradient>
    <clipPath id="cBall"><circle cx="50" cy="50" r="44"/></clipPath>
    <clipPath id="cTen"><circle cx="50" cy="50" r="40"/></clipPath>
  </defs>
</svg>
<div class="pick" id="pick">
  <button data-v="B" class="on">B réaliste · animé</button>
  <button data-v="P">Gros plan des icônes</button>
</div>
<div class="sky" id="sky"></div>
<div class="board" id="board"></div>
<div class="login">
  <div class="brand">NOVA<b>LYZ</b></div>
  <div class="tag">Analyse · décide · progresse</div>
  <div class="card">
    <label>Identifiant</label><input placeholder="1234">
    <label>Mot de passe</label><input type="password" placeholder="••••••">
    <button>Se connecter</button>
  </div>
</div>
<script>
// Pentagone régulier (centre cx,cy, rayon r, rotation en degrés).
function penta(cx, cy, r, rot) { var p = []; for (var i = 0; i < 5; i++) { var a = (rot - 90 + i * 72) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); } return p.join(' '); }
function ptAt(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
var GLOSS = '<ellipse cx="36" cy="30" rx="15" ry="9" fill="#fff" opacity=".45" transform="rotate(-28 36 30)"/>';
function foot() {
  var s = '<circle cx="50" cy="50" r="44" fill="url(#gFoot)"/><g clip-path="url(#cBall)">';
  // Coutures : du pentagone central vers les pentagones extérieurs (motif ballon « 32 panneaux »)
  for (var i = 0; i < 5; i++) {
    // Couture radiale depuis chaque sommet du pentagone central, puis fourche vers les pentagones voisins (hexagones).
    var v = ptAt(50, 50, 13, i * 72), o = ptAt(50, 50, 27, i * 72), a1 = ptAt(50, 50, 33, i * 72 + 21), a2 = ptAt(50, 50, 33, i * 72 - 21);
    var f = function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); };
    s += '<path d="M' + f(v) + 'L' + f(o) + 'M' + f(o) + 'L' + f(a1) + 'M' + f(o) + 'L' + f(a2) + '" fill="none" stroke="#a3a9b4" stroke-width="1.1"/>';
    var c = ptAt(50, 50, 41, i * 72 + 36);
    s += '<polygon points="' + penta(c[0], c[1], 12.5, i * 72 + 36 + 180) + '" fill="url(#gPenta)"/>';
  }
  s += '<polygon points="' + penta(50, 50, 13, 0) + '" fill="url(#gPenta)"/>';
  return s + '</g><circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#7d8592" stroke-width="1"/>';
}
function basket() {
  return '<circle cx="50" cy="50" r="44" fill="url(#gBasket)"/>'
    + '<g fill="none" stroke="#1b1410" stroke-width="2.6" stroke-linecap="round" clip-path="url(#cBall)">'
    + '<path d="M50 6 C46 30 46 70 50 94"/><path d="M6 50 C30 46 70 46 94 50"/>'
    + '<path d="M18 17 C33 33 33 67 18 83"/><path d="M82 17 C67 33 67 67 82 83"/></g>'
    + '<circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#7a3410" stroke-width="1"/>';
}
function rugby() {
  var laces = ''; for (var i = -3; i <= 3; i++) laces += '<rect x="' + (47 + i * 5.4).toFixed(1) + '" y="40" width="2.6" height="8" rx="1.2" fill="#fbfaf6" transform="rotate(0)"/>';
  return '<g transform="rotate(-32 50 50)"><ellipse cx="50" cy="50" rx="46" ry="27" fill="url(#gRugby)"/>'
    + '<path d="M8 50 Q50 38 92 50" fill="none" stroke="#3d1a07" stroke-width="1.6" opacity=".7"/>'
    + '<path d="M28 44 Q50 39 72 44" fill="none" stroke="#fbfaf6" stroke-width="2"/>' + laces
    + '<ellipse cx="50" cy="50" rx="46" ry="27" fill="url(#gShade)"/>'
    + '<ellipse cx="36" cy="40" rx="16" ry="5.5" fill="#fff" opacity=".35"/>'
    + '<ellipse cx="50" cy="50" rx="46" ry="27" fill="none" stroke="#4a2008" stroke-width="1"/></g>';
}
function tennis() {
  return '<circle cx="50" cy="50" r="40" fill="url(#gTennis)"/>'
    + '<g fill="none" stroke="#fdfdf2" stroke-width="4.2" stroke-linecap="round" clip-path="url(#cTen)"><path d="M14 20 C34 36 34 64 14 80"/><path d="M86 20 C66 36 66 64 86 80"/></g>'
    + '<circle cx="50" cy="50" r="40" fill="url(#gShade)"/><ellipse cx="38" cy="32" rx="13" ry="8" fill="#fff" opacity=".4" transform="rotate(-28 38 32)"/>'
    + '<circle cx="50" cy="50" r="40" fill="none" stroke="#8a9a10" stroke-width="1"/>';
}
function volley() {
  return '<circle cx="50" cy="50" r="44" fill="url(#gWhite)"/><g clip-path="url(#cBall)">'
    + '<path d="M50 50 C52 30 64 14 86 10 L96 30 C76 30 62 40 50 50Z" fill="#f3c321"/>'
    + '<path d="M50 50 C32 42 16 44 4 56 L8 76 C20 62 34 56 50 50Z" fill="#1e50d6"/>'
    + '<path d="M50 50 C56 68 54 84 42 96 L64 96 C70 80 66 64 50 50Z" fill="#f3c321"/>'
    + '<path d="M50 50 C70 52 84 62 92 80 L98 60 C86 50 70 48 50 50Z" fill="#1e50d6"/>'
    + '<path d="M50 50 C40 34 26 24 10 22 L20 10 C34 16 44 32 50 50Z" fill="#1e50d6"/>'
    + '<g fill="none" stroke="#2b3240" stroke-width="1.2" opacity=".6"><path d="M50 50 C52 30 64 14 86 10"/><path d="M50 50 C32 42 16 44 4 56"/><path d="M50 50 C56 68 54 84 42 96"/><path d="M50 50 C70 52 84 62 92 80"/><path d="M50 50 C40 34 26 24 10 22"/></g></g>'
    + '<circle cx="50" cy="50" r="44" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="44" fill="none" stroke="#8a93a3" stroke-width="1"/>';
}
function hand() {
  // Ballon de hand : panneaux courbes en « lentilles » (bleu + jaune) sur fond blanc.
  return '<circle cx="50" cy="50" r="42" fill="url(#gWhite)"/><g clip-path="url(#cBall)">'
    + '<path d="M50 8 C28 26 28 74 50 92 C40 74 40 26 50 8Z" fill="#1e50d6"/>'
    + '<path d="M50 8 C72 26 72 74 50 92 C60 74 60 26 50 8Z" fill="#f3c321"/>'
    + '<path d="M8 52 C26 34 74 34 92 52 C74 44 26 44 8 52Z" fill="#1e50d6" opacity=".9"/>'
    + '<g fill="none" stroke="#2b3240" stroke-width="1.1" opacity=".55"><path d="M50 8 C28 26 28 74 50 92"/><path d="M50 8 C72 26 72 74 50 92"/><path d="M50 8 C40 26 40 74 50 92"/><path d="M50 8 C60 26 60 74 50 92"/><path d="M8 52 C26 34 74 34 92 52"/></g></g>'
    + '<circle cx="50" cy="50" r="42" fill="url(#gShade)"/>' + GLOSS + '<circle cx="50" cy="50" r="42" fill="none" stroke="#8a93a3" stroke-width="1"/>';
}
function haltere() {
  var plate = function (x, w, h, g) { return '<rect x="' + x + '" y="' + (50 - h / 2) + '" width="' + w + '" height="' + h + '" rx="3" fill="url(#' + g + ')" stroke="#05060a" stroke-width=".8"/><rect x="' + (x + 1) + '" y="' + (50 - h / 2 + 2) + '" width="' + (w - 2) + '" height="3" rx="1.5" fill="#fff" opacity=".18"/>'; };
  return '<rect x="6" y="46.5" width="88" height="7" rx="3.5" fill="url(#gBar)" stroke="#5c636e" stroke-width=".6"/>'
    + plate(14, 9, 44, 'gPlate') + plate(23, 7, 34, 'gPlate2') + '<rect x="30" y="44" width="4" height="12" rx="1.5" fill="#c9ced6" stroke="#6b737e" stroke-width=".6"/>'
    + plate(77, 9, 44, 'gPlate') + plate(70, 7, 34, 'gPlate2') + '<rect x="66" y="44" width="4" height="12" rx="1.5" fill="#c9ced6" stroke="#6b737e" stroke-width=".6"/>'
    + '<rect x="36" y="47.4" width="28" height="1.6" fill="#fff" opacity=".55"/>';
}
function kettlebell() {
  return '<path d="M34 38 C30 14 70 14 66 38" fill="none" stroke="url(#gKb)" stroke-width="9" stroke-linecap="round"/>'
    + '<path d="M50 34 C74 34 86 52 82 70 C79 84 66 90 50 90 C34 90 21 84 18 70 C14 52 26 34 50 34Z" fill="url(#gKb)"/>'
    + '<rect x="36" y="80" width="28" height="6" rx="3" fill="#0b0c10"/>'
    + '<ellipse cx="38" cy="50" rx="10" ry="6" fill="#fff" opacity=".22" transform="rotate(-30 38 50)"/>'
    + '<text x="50" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#c9ced6" opacity=".85">16</text>';
}
function badminton() {
  var feathers = ''; for (var i = -3; i <= 3; i++) feathers += '<path d="M50 62 L' + (50 + i * 9) + ' 14" stroke="#c9ced6" stroke-width="1.1"/>';
  return '<path d="M50 62 L22 14 Q50 4 78 14 Z" fill="#fbfbf8" stroke="#aab1bc" stroke-width="1"/>' + feathers
    + '<path d="M30 32 Q50 26 70 32" fill="none" stroke="#c43b3b" stroke-width="2"/>'
    + '<path d="M36 46 Q50 42 64 46" fill="none" stroke="#c43b3b" stroke-width="2"/>'
    + '<path d="M40 62 Q50 58 60 62 L60 70 Q60 84 50 86 Q40 84 40 70 Z" fill="url(#gGolf)" stroke="#9aa1ad" stroke-width="1"/>'
    + '<rect x="40" y="60" width="20" height="5" rx="2" fill="#1e50d6"/>';
}
function baseball() {
  var st = ''; for (var i = 0; i < 9; i++) { var t = i / 8; var y = 18 + t * 64; st += '<path d="M' + (26 + Math.sin(t * Math.PI) * 9).toFixed(1) + ' ' + y.toFixed(1) + 'l4 -2" stroke="#c4262e" stroke-width="1.6"/><path d="M' + (74 - Math.sin(t * Math.PI) * 9).toFixed(1) + ' ' + y.toFixed(1) + 'l-4 -2" stroke="#c4262e" stroke-width="1.6"/>'; }
  return '<circle cx="50" cy="50" r="40" fill="url(#gGolf)"/><g clip-path="url(#cTen)" fill="none">'
    + '<path d="M22 16 C36 34 36 66 22 84" stroke="#c4262e" stroke-width="1.4"/><path d="M78 16 C64 34 64 66 78 84" stroke="#c4262e" stroke-width="1.4"/>' + st + '</g>'
    + '<circle cx="50" cy="50" r="40" fill="url(#gShade)"/><ellipse cx="38" cy="32" rx="13" ry="8" fill="#fff" opacity=".5" transform="rotate(-28 38 32)"/><circle cx="50" cy="50" r="40" fill="none" stroke="#9aa1ad" stroke-width="1"/>';
}
function golf() {
  var d = ''; for (var y = 22; y <= 80; y += 9) for (var x = 22; x <= 80; x += 9) { var dx = x + ((y / 9) % 2 ? 4.5 : 0); if ((dx - 50) * (dx - 50) + (y - 50) * (y - 50) < 30 * 30) d += '<circle cx="' + dx + '" cy="' + y + '" r="2.1" fill="#c4cad3" opacity=".7"/>'; }
  return '<circle cx="50" cy="50" r="34" fill="url(#gGolf)"/>' + d
    + '<circle cx="50" cy="50" r="34" fill="url(#gShade)"/><ellipse cx="40" cy="36" rx="10" ry="6" fill="#fff" opacity=".6" transform="rotate(-28 40 36)"/><circle cx="50" cy="50" r="34" fill="none" stroke="#9aa1ad" stroke-width="1"/>';
}
function hockey() {
  return '<ellipse cx="50" cy="60" rx="38" ry="12" fill="#07080a"/><rect x="12" y="44" width="76" height="16" fill="url(#gPuck)"/>'
    + '<ellipse cx="50" cy="44" rx="38" ry="12" fill="#2b2f37"/><ellipse cx="50" cy="44" rx="30" ry="8.5" fill="none" stroke="#454a54" stroke-width="1"/>'
    + '<g stroke="#4a4f59" stroke-width="1">' + [18, 26, 34, 42, 50, 58, 66, 74, 82].map(function (x) { return '<path d="M' + x + ' 47v12"/>'; }).join('') + '</g>'
    + '<ellipse cx="38" cy="41" rx="12" ry="3" fill="#fff" opacity=".18"/>';
}
var ICONS = { haltere: haltere(), kettlebell: kettlebell(), foot: foot(), basket: basket(), rugby: rugby(), tennis: tennis(), hand: hand(), volley: volley(), badminton: badminton(), baseball: baseball(), golf: golf(), hockey: hockey() };
var NOMS = { haltere: 'Haltère', kettlebell: 'Kettlebell', foot: 'Foot', basket: 'Basket', rugby: 'Rugby', tennis: 'Tennis', hand: 'Handball', volley: 'Volley', badminton: 'Badminton', baseball: 'Baseball', golf: 'Golf', hockey: 'Hockey' };
var KINDS = ['haltere', 'foot', 'basket', 'rugby', 'haltere', 'tennis', 'hand', 'volley', 'kettlebell', 'badminton', 'baseball', 'golf', 'hockey', 'haltere'];
function rnd(a, b) { return a + Math.random() * (b - a); }
function buildSky() {
  var W = innerWidth, H = innerHeight, html = '', n = 14;
  for (var i = 0; i < n; i++) {
    var k = KINDS[i % KINDS.length], s = Math.round(rnd(30, 60));
    var pt = function () { return [Math.round(rnd(-40, W - 10)) + 'px', Math.round(rnd(-40, H - 10)) + 'px']; };
    var p0 = pt(), p1 = pt(), p2 = pt(), p3 = pt();
    var st = '--s:' + s + 'px;--op:' + rnd(.5, .75).toFixed(2) + ';--d:' + rnd(30, 48).toFixed(1) + 's;--dl:-' + rnd(0, 40).toFixed(1) + 's;--r:' + rnd(20, 42).toFixed(1) + 's;--rot:' + (Math.random() < .5 ? '-' : '') + '360deg;'
      + '--x0:' + p0[0] + ';--y0:' + p0[1] + ';--x1:' + p1[0] + ';--y1:' + p1[1] + ';--x2:' + p2[0] + ';--y2:' + p2[1] + ';--x3:' + p3[0] + ';--y3:' + p3[1];
    html += '<div class="it" style="' + st + '"><svg viewBox="0 0 100 100">' + ICONS[k] + '</svg></div>';
  }
  document.getElementById('sky').innerHTML = html;
}
function buildBoard() {
  document.getElementById('board').innerHTML = Object.keys(ICONS).map(function (k) { return '<figure><svg viewBox="0 0 100 100">' + ICONS[k] + '</svg>' + NOMS[k] + '</figure>'; }).join('');
}
function show(v) {
  document.getElementById('board').classList.toggle('on', v === 'P');
  document.querySelectorAll('#pick button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
}
buildSky(); buildBoard();
document.getElementById('pick').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.v); });
show((location.hash || '').toUpperCase() === '#P' ? 'P' : 'B');
</script>
</body>
</html>
