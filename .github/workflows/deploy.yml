name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Ensure gh-pages directory exists
        run: mkdir -p gh-pages/dev

      - name: Copy front assets to correct location
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            DEST=gh-pages
          else
            DEST=gh-pages/dev
          fi
          mkdir -p "$DEST"
          # Fichiers racine de la coquille
          cp index.html manifest.json sw.js "$DEST"/ 2>/dev/null || true
          cp "logo novalyz.png" "$DEST"/ 2>/dev/null || true
          # Dossiers (on nettoie l'ancien contenu pour éviter les fichiers obsolètes)
          for d in css js assets; do
            if [ -d "$d" ]; then
              rm -rf "$DEST/$d"
              cp -r "$d" "$DEST"/
            fi
          done

      - name: Commit and push gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Deploy ${{ github.ref_name }} @ ${{ github.sha }}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:gh-pages
