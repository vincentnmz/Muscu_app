# Construit l'APK Android (debug) de Novalyz sur un runner GitHub — qui dispose
# du SDK Android. Déclenchement MANUEL (Actions → « Build APK Android » → Run).
# L'APK est publié en artefact téléchargeable. Sans google-services.json, l'app
# se construit et tourne : seules les notifications push FCM restent inactives
# (Firebase à brancher ensuite).
name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour publier la Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17 pour AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Injecter google-services.json (config Firebase, depuis le secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON absent → APK construit SANS push FCM."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✓ google-services.json injecté ($(wc -c < android/app/google-services.json) octets)"
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Assembler www/ (coquille web pour Capacitor)
        run: npm run build:www

      - name: Marqueur de build (date + sha) dans l'app
        run: |
          BID="$(date -u +%Y-%m-%d\ %H:%M)Z-${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD_ID__/$BID/g" www/js/app.js
          echo "BUILD_ID = $BID"
          grep -m1 "var BUILD_ID" www/js/app.js || true

      - name: versionCode unique (n° de run) → Android reconnaît la mise à jour
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -m1 versionCode android/app/build.gradle

      - name: Synchroniser Capacitor (www → android + plugins)
        run: npx cap sync android

      - name: Construire l'APK debug
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: novalyz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publie l'APK dans une Release à tag fixe (novalyz-apk-latest) : lien de
      # téléchargement direct et stable, installable en tapant dessus au téléphone.
      # On efface la Release précédente pour garder un seul « dernier APK ».
      - name: Publier l'APK en Release (lien direct téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete novalyz-apk-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create novalyz-apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Novalyz — APK de test (debug)" \
            --notes "Build automatique depuis \`${{ github.ref_name }}\` (commit ${{ github.sha }}). APK de test : notifications push FCM inactives tant que Firebase n'est pas branché. Installe-le en autorisant les sources inconnues." \
            --target "${{ github.sha }}"
