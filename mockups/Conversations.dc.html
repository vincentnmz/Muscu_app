<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#F9FBFF; --surface:#FFFFFF; --surface2:#EEF3FF; --border:#D8E2FF;
      --text:#070B14; --muted:#4A5980; --subtle:#8595B8;
      --accent:#1A5FFF; --accent-a:rgba(26,95,255,.08); --on-accent:#FFFFFF; --warn:#E07800; --good:#00A854;
      --font:'Quicksand','Helvetica Neue',Arial,sans-serif; --head:'Michroma','Helvetica Neue',Arial,sans-serif;
      --sh:0 6px 20px rgba(7,11,20,.08); --sh-sm:0 1px 2px rgba(7,11,20,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;}
    .phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;}
    .top{display:flex;align-items:center;gap:12px;padding:16px 15px;border-bottom:1px solid var(--border);background:var(--surface);}
    .back{width:34px;height:34px;border-radius:999px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none;}
    .ttl{font-family:var(--head);font-size:16px;}
    .list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
    .thread{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;box-shadow:var(--sh-sm);}
    .thread .av{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;font-family:var(--head);font-size:14px;color:#fff;}
    .av.ia{background:var(--accent);} .av.coach{background:#6d3fd4;}
    .thread .mid{flex:1;min-width:0;}
    .thread .mid .r1{display:flex;align-items:center;gap:7px;}
    .thread .mid .nm{font-weight:700;font-size:14px;}
    .thread .mid .tag{font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-a);border-radius:5px;padding:2px 5px;}
    .thread .mid .pv{font-size:12px;color:var(--subtle);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .thread .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;}
    .thread .rt .tm{font-size:10.5px;color:var(--subtle);}
    .unread{min-width:19px;height:19px;border-radius:999px;background:var(--warn);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 5px;}
    .sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);font-weight:700;margin:6px 4px -2px;}
    .invite{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--border);border-radius:16px;padding:14px;background:transparent;}
    .invite .ic{width:40px;height:40px;border-radius:12px;background:var(--surface2);color:var(--accent);display:grid;place-items:center;flex:none;}
    .invite .a{font-weight:700;font-size:13.5px;} .invite .b{font-size:11.5px;color:var(--subtle);margin-top:2px;}
  </style>
</helmet>

<div class="phone">
  <div class="top">
    <span class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
    <span class="ttl">Conversations</span>
  </div>

  <div class="list">
    <div class="thread">
      <span class="av ia">N</span>
      <div class="mid">
        <div class="r1"><span class="nm">Novalyz IA</span><span class="tag">assistant</span></div>
        <div class="pv">Remets 2 séances pec/semaine et vise +1 rep…</div>
      </div>
      <div class="rt"><span class="tm">à l'instant</span></div>
    </div>

    <div class="thread">
      <span class="av coach">CT</span>
      <div class="mid">
        <div class="r1"><span class="nm">Coach Thomas</span></div>
        <div class="pv">Beau boulot au squat ! On garde 100 kg cette…</div>
      </div>
      <div class="rt"><span class="tm">9:12</span><span class="unread">2</span></div>
    </div>

    <div class="sec">Pas encore de coach ?</div>
    <button class="invite">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.5-3.3 2.9-5 5.5-5s5 1.7 5.5 5"/><path d="M18 8v6M15 11h6"/></svg></span>
      <div><div class="a">Inviter un coach</div><div class="b">Partage ton suivi avec un coach ou un prépa.</div></div>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
